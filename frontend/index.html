    // ========== LOGIN ==========
    function Login({ onLogin, onSignup, lang, setLang }) {
      const t = translations[lang];
      const [role, setRole] = useState(null);
      const [mode, setMode] = useState('email');
      const [value, setValue] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [loading, setLoading] = useState(false);

      const roles = [
        { id: 'citizen', emoji: '👤', title: t.citizen, desc: t.citizenDesc, color: 'from-blue-500 to-blue-600' },
        { id: 'official', emoji: '🏛️', title: t.official, desc: t.officialDesc, color: 'from-emerald-500 to-teal-600' },
        { id: 'admin', emoji: '⚙️', title: t.admin, desc: t.adminDesc, color: 'from-violet-500 to-purple-600' }
      ];

      const validate = () => {
        if (!value.trim()) {
          setError(lang === 'te' ? 'దయచేసి మీ ఇమెయిల్ లేదా మొబైల్ నంబర్ నమోదు చేయండి' : lang === 'hi' ? 'कृपया अपना ईमेल या मोबाइल नंबर दर्ज करें' : 'Please enter your email or mobile number');
          return false;
        }
        if (!password) {
          setError('Please enter your password.');
          return false;
        }
        if (mode === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
          setError(lang === 'te' ? 'దయచేసి చెల్లుబాటు అయ్యే ఇమెయిల్ చిరునామా నమోదు చేయండి' : lang === 'hi' ? 'कृपया एक वैध ईमेल पता दर्ज करें' : 'Please enter a valid email address');
          return false;
        }
        if (mode === 'mobile' && !/^[6-9]\d{9}$/.test(value.replace(/\s+/g, ''))) {
          setError(lang === 'te' ? 'దయచేసి చెల్లుబాటు అయ్యే 10 అంకెల మొబైల్ నంబర్ నమోదు చేయండి' : lang === 'hi' ? 'कृपया एक वैध 10 अंकों का मोबाइल नंबर दर्ज करें' : 'Please enter a valid 10-digit mobile number');
          return false;
        }
        setError('');
        return true;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!validate()) return;
        setLoading(true);
        try {
          const response = await apiRequest('/auth/signin', {
            method: 'POST',
            body: JSON.stringify({ identifier: value.trim(), type: mode, password, requestedRole: role }),
          });
          onLogin({ ...response.user, authToken: response.token });
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setLoading(false);
        }
      };

      if (!role) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-primary-900 to-primary-800 px-4 relative overflow-hidden">
            <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-primary-600/20 via-transparent to-transparent"></div>
            <div className="absolute top-6 right-6 z-10"><LanguageSwitcher lang={lang} setLang={setLang} dark={true} /></div>
            
            <div className="w-full max-w-3xl relative z-10 animate-fade-in">
              <div className="text-center mb-12">
                <div className="w-20 h-20 bg-white rounded-2xl flex items-center justify-center mx-auto shadow-2xl shadow-primary-500/20 mb-6">
                  <span className="text-primary-700 font-extrabold text-4xl">C</span>
                </div>
                <h1 className="text-3xl sm:text-4xl font-bold text-white tracking-tight">{t.appName}</h1>
                <p className="mt-3 text-primary-200 text-lg">{t.whoAreYou}</p>
              </div>

              <div className="grid sm:grid-cols-3 gap-5">
                {roles.map((r, i) => (
                  <button key={r.id} onClick={() => setRole(r.id)}
                    className="group relative bg-white/10 backdrop-blur-md border border-white/20 rounded-2xl p-7 text-left hover:bg-white/20 hover:border-white/40 transition-all duration-300 hover:-translate-y-1 hover:shadow-xl">
                    <div className={`w-14 h-14 rounded-xl bg-gradient-to-br ${r.color} flex items-center justify-center text-2xl mb-5 shadow-lg`}>
                      {r.emoji}
                    </div>
                    <h3 className="font-semibold text-white text-lg">{r.title}</h3>
                    <p className="text-sm text-primary-200 mt-1.5 leading-relaxed">{r.desc}</p>
                    <div className="absolute top-5 right-5 opacity-0 group-hover:opacity-100 transition-opacity">
                      <Icon name="arrow-right" size={18} className="text-white" />
                    </div>
                  </button>
                ))}
              </div>
            </div>
          </div>
        );
      }

      const currentRole = roles.find(r => r.id === role);
      return (
        <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-primary-900 to-primary-800 px-4 relative">
          <div className="absolute top-6 right-6 z-10"><LanguageSwitcher lang={lang} setLang={setLang} dark={true} /></div>
          
          <div className="w-full max-w-md relative z-10 animate-slide-up">
            <div className="text-center mb-8">
              <div className="w-16 h-16 bg-white rounded-2xl flex items-center justify-center mx-auto shadow-xl mb-4">
                <span className="text-primary-700 font-extrabold text-3xl">C</span>
              </div>
              <h1 className="text-2xl font-bold text-white">{t.appName}</h1>
              <div className="mt-3 inline-flex items-center gap-2 bg-white/15 backdrop-blur text-white px-4 py-1.5 rounded-full text-sm font-medium">
                <span>{currentRole.emoji}</span>
                <span>{currentRole.title}</span>
              </div>
            </div>

            <div className="bg-white rounded-3xl shadow-2xl p-8">
              <div className="flex items-center justify-between mb-7">
                <div>
                  <h2 className="text-xl font-bold text-slate-900">{t.welcome}</h2>
                  <p className="text-slate-500 text-sm mt-1">{t.enterDetails}</p>
                </div>
                <button onClick={() => { setRole(null); setMode('email'); setValue(''); setError(''); }}
                  className="text-sm text-primary-600 hover:text-primary-700 font-medium hover:underline">
                  {t.changeRole}
                </button>
              </div>

              <div className="flex bg-slate-100 rounded-xl p-1 mb-6">
                <button type="button" onClick={() => { setMode('email'); setValue(''); setPassword(''); setError(''); }}
                  className={`flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all ${mode === 'email' ? 'bg-white shadow text-primary-700' : 'text-slate-500 hover:text-slate-700'}`}>
                  {t.emailId}
                </button>
                {role !== 'admin' && <button type="button" onClick={() => { setMode('mobile'); setValue(''); setPassword(''); setError(''); }}
                  className={`flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all ${mode === 'mobile' ? 'bg-white shadow text-primary-700' : 'text-slate-500 hover:text-slate-700'}`}>
                  {t.mobileNumber}
                </button>}
              </div>

              <form onSubmit={handleSubmit} className="space-y-5">
                <div>
                  <label className="block text-sm font-semibold text-slate-700 mb-2">
                    {mode === 'email' ? t.emailAddress : t.mobileNumber}
                  </label>
                  <div className="relative">
                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                      <Icon name={mode === 'email' ? 'mail' : 'smartphone'} size={18} />
                    </span>
                    <input
                      type={mode === 'email' ? 'email' : 'tel'}
                      value={value}
                      onChange={e => setValue(e.target.value)}
                      placeholder={mode === 'email' ? 'you@example.com' : '9876543210'}
                      className="w-full rounded-xl border border-slate-200 pl-11 pr-4 py-3.5 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all bg-slate-50 focus:bg-white"
                      autoFocus
                    />
                  </div>
                  {error && <p className="mt-2 text-sm text-red-600 flex items-center gap-1.5"><Icon name="alert-circle" size={14} /> {error}</p>}
                </div>
                <div>
                  <label className="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                  <div className="relative">
                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="lock" size={18} /></span>
                    <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Enter your password" autoComplete="current-password"
                      className="w-full rounded-xl border border-slate-200 pl-11 pr-4 py-3.5 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-all bg-slate-50 focus:bg-white" />
                  </div>
                </div>

                <button type="submit" disabled={loading}
                  className="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-primary-600 to-primary-700 hover:from-primary-700 hover:to-primary-800 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg shadow-primary-500/25 hover:shadow-primary-500/40 disabled:opacity-70">
                  {loading ? (<><Icon name="loader-2" size={20} className="animate-spin" /> {t.signingIn}</>) : (<><Icon name="log-in" size={18} /> {t.continueAs} {currentRole.title}</>)}

              <p className="mt-6 text-center text-xs text-slate-400">{t.terms}</p>

            <p className="mt-6 text-center text-primary-200/80 text-sm">{t.demoNote}</p>
          </div>

      );

    // ========== SIGNUP ==========
    function Signup({ onBack, lang, setLang }) {
      const [form, setForm] = useState({ name: '', email: '', phone: '', location: '', latitude: null, longitude: null, password: '', confirmPassword: '', role: 'citizen' });
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState(false);
      const [pendingApproval, setPendingApproval] = useState(false);
      const [otpStep, setOtpStep] = useState(false);
      const [otp, setOtp] = useState('');
      const [otpLoading, setOtpLoading] = useState(false);
      const [otpSentMessage, setOtpSentMessage] = useState('');

      const handleSubmit = async (event) => {
        event.preventDefault();
        setError('');
        setOtpSentMessage('');
        if (form.password !== form.confirmPassword) {
          setError('Passwords do not match.');
          return;
        }
        if (!form.location.trim()) {
          setError('Please enter your location or choose your current location.');
          return;
        }
        setLoading(true);
        try {
          const response = await apiRequest('/auth/signup/request-otp', {
            method: 'POST',
            body: JSON.stringify({
              name: form.name,
              email: form.email,
              phone: form.phone,
              location: form.location,
              coordinates: form.latitude !== null && form.longitude !== null ? { latitude: form.latitude, longitude: form.longitude } : null,
              password: form.password,
              role: form.role,
            }),
          });
          setOtpStep(true);
          setOtp('');
          setOtpSentMessage(response.message || `OTP sent successfully to ${form.email}.`);
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setLoading(false);
        }
      };

      const handleVerifyOtp = async (event) => {
        event.preventDefault();
        setError('');
        setOtpLoading(true);
        try {
          const response = await apiRequest('/auth/signup/verify-otp', {
            method: 'POST',
            body: JSON.stringify({ email: form.email, otp }),
          });

            {[
              { label: t.openCases, value: openCases, icon: 'clock', color: 'bg-blue-50 text-blue-600' },
              { label: t.critical, value: criticalCases, icon: 'alert-triangle', color: 'bg-red-50 text-red-600' },
              { label: t.escalated, value: escalatedCases, icon: 'arrow-up-right', color: 'bg-orange-50 text-orange-600' },
              { label: t.resolvedToday, value: resolvedToday, icon: 'check-circle', color: 'bg-emerald-50 text-emerald-600' },
            ].map(k => (
              <div key={k.label} className="card-hover bg-white rounded-2xl border border-slate-100 p-5 shadow-soft">
                <div className={`w-11 h-11 rounded-xl flex items-center justify-center ${k.color}`}>
                  <Icon name={k.icon} size={22} />
                </div>
                <div className="mt-4 text-2xl font-bold text-slate-900">{k.value}</div>
                <div className="text-sm text-slate-500 font-medium mt-0.5">{k.label}</div>
              </div>
            ))}
          </div>

          <div className="bg-white rounded-3xl border border-slate-100 shadow-soft overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="bg-slate-50/80 border-b border-slate-100">
                  <tr>
                    {[t.caseId, t.categoryCol, t.locationCol, t.priorityCol, t.statusCol, t.ageCol, t.actionCol].map(h => (
                      <th key={h} className="text-left px-5 py-4 font-semibold text-slate-600">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-50">
                  {filtered.map(c => (
                    <tr key={c.id} className="hover:bg-slate-50/50 transition-colors">
                      <td className="px-5 py-4 font-mono font-semibold text-primary-700">{c.id}</td>
                      <td className="px-5 py-4">{c.category}</td>
                      <td className="px-5 py-4 text-slate-600">{c.location}</td>
                      <td className="px-5 py-4">
                        <span className={`inline-flex px-2.5 py-1 rounded-full text-xs font-semibold ${
                          c.score > 90 ? 'bg-red-50 text-red-700' : c.score > 70 ? 'bg-orange-50 text-orange-700' : 'bg-slate-100 text-slate-700'
                        }`}>
                          {c.priority} ({c.score})
                        </span>
                      </td>
                      <td className="px-5 py-4 text-slate-700">{c.status}</td>
                      <td className="px-5 py-4 text-slate-500">{c.age}</td>
                      <td className="px-5 py-4">
                        <button className="text-primary-600 font-semibold hover:text-primary-700 hover:underline">{t.view}</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    }

    // ========== ANALYTICS ==========
    function Analytics({ lang }) {
      const t = translations[lang];
      const hotspots = [
        { area: 'Ward 12 – Main Road', count: 28, type: lang === 'te' ? 'రోడ్లు' : lang === 'hi' ? 'सड़क' : 'Roads' },
        { area: 'Sector 7 Market', count: 19, type: lang === 'te' ? 'డ్రైనేజీ' : lang === 'hi' ? 'जल निकासी' : 'Drainage' },
        { area: 'Colony B', count: 15, type: lang === 'te' ? 'వ్యర్థాలు' : lang === 'hi' ? 'कचरा' : 'Waste' },
        { area: 'Park Avenue', count: 12, type: lang === 'te' ? 'స్ట్రీట్‌లైట్లు' : lang === 'hi' ? 'स्ट्रीटलाइट' : 'Streetlights' },
      ];
      const categories = [
        { name: lang === 'te' ? 'రోడ్లు & గుంతలు' : lang === 'hi' ? 'सड़क और गड्ढे' : 'Roads & Potholes', value: 42, color: 'bg-blue-500' },
        { name: lang === 'te' ? 'వ్యర్థాల నిర్వహణ' : lang === 'hi' ? 'कचरा प्रबंधन' : 'Waste Management', value: 28, color: 'bg-teal-500' },
        { name: lang === 'te' ? 'డ్రైనేజీ' : lang === 'hi' ? 'जल निकासी' : 'Drainage', value: 19, color: 'bg-amber-500' },
        { name: lang === 'te' ? 'స్ట్రీట్‌లైట్లు' : lang === 'hi' ? 'स्ट्रीटलाइट' : 'Streetlights', value: 15, color: 'bg-purple-500' },
        { name: lang === 'te' ? 'నీటి సరఫరా' : lang === 'hi' ? 'जल आपूर्ति' : 'Water Supply', value: 11, color: 'bg-cyan-500' },
      ];

      return (
        <div className="max-w-7xl mx-auto px-4 py-10 animate-fade-in">
          <h1 className="text-3xl font-bold text-slate-900 mb-2">{t.cityAnalyticsTitle}</h1>
          <p className="text-slate-600 mb-8">{t.recurringProblems}</p>

          <div className="grid lg:grid-cols-3 gap-6 mb-8">
            <div className="lg:col-span-2 bg-white rounded-3xl border border-slate-100 shadow-soft p-6">
              <h2 className="font-semibold text-lg mb-5 flex items-center gap-2">
                <Icon name="trending-up" size={20} className="text-primary-600" /> {t.complaintsByCategory}
              </h2>
              <div className="space-y-5">
                {categories.map(item => (
                  <div key={item.name}>
                    <div className="flex justify-between text-sm mb-1.5">
                      <span className="font-medium text-slate-700">{item.name}</span>
                      <span className="font-semibold text-slate-900">{item.value}%</span>
                    </div>
                    <div className="h-2.5 bg-slate-100 rounded-full overflow-hidden">
                      <div className={`h-full ${item.color} rounded-full transition-all duration-700`} style={{ width: `${item.value}%` }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-6">
              <h2 className="font-semibold text-lg mb-5 flex items-center gap-2">
                <Icon name="alert-circle" size={20} className="text-orange-500" /> {t.topHotspots}
              </h2>
              <div className="space-y-4">
                {hotspots.map((h, i) => (
                  <div key={h.area} className="flex items-start gap-3">
                    <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-sm font-bold text-slate-600 shrink-0">
                      {i + 1}
                    </div>
                    <div>
                      <div className="font-medium text-slate-900">{h.area}</div>
                      <div className="text-sm text-slate-500">{h.count} · {h.type}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-6">
            <h2 className="font-semibold text-lg mb-2 flex items-center gap-2">
              <Icon name="map" size={20} className="text-primary-600" /> {t.recurringInsightsTitle}
            </h2>
            <p className="text-slate-600 text-sm mb-5">{t.recurringDesc}</p>
            <div className="grid sm:grid-cols-2 gap-4">
              <div className="bg-amber-50 border border-amber-100 rounded-2xl p-5">
                <div className="font-semibold text-amber-900">Ward 12 Road Network</div>
                <p className="text-sm text-amber-800 mt-1.5 leading-relaxed">
                  {lang === 'te' ? '45 రోజుల్లో 28 గుంత ఫిర్యాదులు. సిఫార్సు: పూర్తి రీసర్ఫేసింగ్ అసెస్‌మెంట్.' : lang === 'hi' ? '45 दिनों में 28 गड्ढे की शिकायतें। सुझाव: पूर्ण रिसरफेसिंग मूल्यांकन।' : '28 pothole complaints in 45 days. Recommended: Full resurfacing assessment.'}
                </p>
              </div>
              <div className="bg-blue-50 border border-blue-100 rounded-2xl p-5">
                <div className="font-semibold text-blue-900">Sector 7 Drainage</div>
                <p className="text-sm text-blue-800 mt-1.5 leading-relaxed">
                  {lang === 'te' ? 'మధ్యస్థ వర్షం తర్వాత పునరావృత వరదలు. సిఫార్సు: కెపాసిటీ అప్‌గ్రేడ్ స్టడీ.' : lang === 'hi' ? 'मध्यम बारिश के बाद आवर्ती बाढ़। सुझाव: क्षमता उन्नयन अध्ययन।' : 'Recurring flooding after moderate rain. Recommended: Capacity upgrade study.'}
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========== ADMIN NOTIFICATIONS ==========
    function AdminNotifications() {
      const [requests, setRequests] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [actionId, setActionId] = useState('');

      const loadRequests = async () => {
        setError('');
        try {
          const response = await apiRequest('/admin/notifications');
          setRequests(response.requests || []);
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { loadRequests(); }, []);

      const decide = async (requestId, decision) => {
        setActionId(requestId);
        setError('');
        try {
          await apiRequest(`/admin/official-requests/${requestId}/${decision}`, { method: 'POST' });
          setRequests(current => current.filter(request => request.requestId !== requestId));
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setActionId('');
        }
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-10 animate-fade-in">
          <div className="flex items-center justify-between gap-4 mb-8">
            <div>
              <h1 className="text-3xl font-bold text-slate-900">Notifications</h1>
              <p className="text-slate-600 mt-1">Review government-official account requests.</p>
            </div>
            <button type="button" onClick={loadRequests} className="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-200 bg-white text-sm font-semibold text-slate-700 hover:bg-slate-50">
              <Icon name="refresh-cw" size={16} /> Refresh
            </button>
          </div>

          {error && <div className="mb-6 rounded-2xl bg-red-50 border border-red-100 px-5 py-4 text-sm text-red-700">{error}</div>}
          {loading && <div className="rounded-2xl bg-blue-50 border border-blue-100 px-5 py-4 text-sm text-blue-700">Loading notifications...</div>}
          {!loading && !requests.length && <div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-10 text-center text-slate-500">No pending notifications.</div>}

          <div className="space-y-5">
            {requests.map(request => (
              <article key={request.requestId} className="bg-white rounded-3xl border border-slate-100 shadow-soft p-6">
                <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                  <div>
                    <div className="flex items-center gap-2">
                      <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center"><Icon name="user-plus" size={20} /></div>
                      <div>
                        <h2 className="font-bold text-slate-900">Government official signup request</h2>
                        <p className="text-xs text-slate-500 mt-0.5">{request.createdAt ? new Date(request.createdAt).toLocaleString() : ''}</p>
                      </div>
                    </div>
                    <div className="grid sm:grid-cols-2 gap-x-8 gap-y-3 mt-6 text-sm">
                      <div><span className="block text-slate-500">Name</span><strong>{request.name}</strong></div>
                      <div><span className="block text-slate-500">Email</span><strong>{request.email}</strong></div>
                      <div><span className="block text-slate-500">Phone</span><strong>{request.phone}</strong></div>
                      <div><span className="block text-slate-500">Location</span><strong>{request.location}</strong></div>
                    </div>
                  </div>
                  <div className="flex sm:flex-col gap-2 shrink-0">
                    <button type="button" disabled={actionId === request.requestId} onClick={() => decide(request.requestId, 'approve')} className="inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-emerald-700 disabled:opacity-60">
                      <Icon name="check" size={16} /> Accept
                    </button>
                    <button type="button" disabled={actionId === request.requestId} onClick={() => decide(request.requestId, 'reject')} className="inline-flex items-center justify-center gap-2 rounded-xl bg-red-50 px-4 py-2.5 text-sm font-semibold text-red-700 hover:bg-red-100 disabled:opacity-60">
                      <Icon name="x" size={16} /> Reject
                    </button>
                  </div>
                </div>
              </article>
            ))}
          </div>
        </div>
      );
    }

    // ========== MAIN APP ==========
    function App() {
      const [user, setUser] = useState(null);
      const [page, setPage] = useState('home');
      const [lang, setLang] = useState('en');
      const [authPage, setAuthPage] = useState('login');

      useEffect(() => { if (window.lucide) lucide.createIcons(); });

      const handleLogin = (userData) => {
        window.civicResolveToken = userData.authToken;
        setUser(userData);
        setPage('home');
      };

      if (!user) {
        return authPage === 'signup'
          ? <Signup onBack={() => setAuthPage('login')} lang={lang} setLang={setLang} />
          : <Login onLogin={handleLogin} onSignup={() => setAuthPage('signup')} lang={lang} setLang={setLang} />;
      }

      return (
        <div className="min-h-screen flex flex-col">
          <Navbar page={page} setPage={setPage} user={user} onLogout={() => { window.civicResolveToken = ''; setUser(null); }} lang={lang} setLang={setLang} />
          <main className="flex-1">
            {page === 'home' && <Home setPage={setPage} user={user} lang={lang} />}
            {page === 'submit' && <SubmitComplaint lang={lang} user={user} />}
            {page === 'track' && <TrackComplaint lang={lang} />}
            {page === 'dashboard' && <Dashboard lang={lang} />}
            {page === 'analytics' && <Analytics lang={lang} />}
            {page === 'notifications' && user.role === 'admin' && <AdminNotifications />}
          </main>
          <Footer lang={lang} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
