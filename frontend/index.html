                      <p className="text-sm text-blue-800 mt-2"><strong>Image analysis:</strong> {selectedCase.progressAnalysis.visibleEvidence}</p>
                      <p className="text-sm text-slate-700 mt-2"><strong>Remaining work:</strong> {selectedCase.progressAnalysis.remainingWork}</p>
                    </div>}
                    {!!selectedCase.progressUpdates?.length && <div className="rounded-2xl border border-slate-100 bg-slate-50 p-5"><h3 className="font-semibold text-slate-900 mb-3">Agent progress history</h3><div className="space-y-3">{selectedCase.progressUpdates.slice().reverse().slice(0, 5).map((update, index) => <div key={`${update.analyzedAt}-${index}`} className="rounded-xl bg-white px-4 py-3"><div className="flex items-center justify-between gap-3"><strong className="text-sm text-slate-800">{update.status} · {update.progressPercent}% solved</strong><span className="text-xs text-slate-400">{formatDate(update.analyzedAt)}</span></div><p className="mt-1 text-sm text-slate-600">{update.summary}</p>{update.photoAttached && <p className="mt-1 text-xs text-primary-700">Official photo analyzed and stored.</p>}</div>)}</div></div>}

                    {!isAssignedToMe ? (
                      <div className="rounded-2xl bg-amber-50 border border-amber-100 p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div><h3 className="font-semibold text-amber-900">This case is available</h3><p className="text-sm text-amber-800 mt-1">Claim it to begin work and update its status.</p></div>
                        <button type="button" onClick={claimCase} disabled={actionLoading === 'claim'} className="inline-flex items-center justify-center gap-2 rounded-xl bg-amber-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-amber-700 disabled:opacity-60"><Icon name="hand" size={16} /> {actionLoading === 'claim' ? 'Claiming...' : 'Claim case'}</button>
                      </div>
                    ) : (
                      <>
                        {selectedCase.assignedTo?.autoAccepted && <div className="mb-4 rounded-2xl border border-emerald-100 bg-emerald-50 p-4 text-sm text-emerald-800"><strong>Location auto-accepted:</strong> {selectedCase.assignedTo.matchMethod === 'gps' ? `The agent matched this case to your office GPS (${selectedCase.assignedTo.distanceKm} km away).` : 'The agent matched the citizen-provided location to your registered work location.'}</div>}
                       <form onSubmit={saveCase} className="rounded-2xl border border-primary-100 bg-primary-50/50 p-5 space-y-4">
                        <div className="flex items-center gap-2"><Icon name="edit-3" size={19} className="text-primary-600" /><h3 className="font-semibold text-slate-900">Update case</h3></div>
                        <div>
                          <label className="block text-sm font-semibold text-slate-700 mb-2">Status</label>
                          <select value={statusValue} onChange={event => setStatusValue(event.target.value)} className="w-full rounded-xl border border-slate-200 px-4 py-3 bg-white outline-none focus:ring-2 focus:ring-primary-500">
                            {['Assigned', 'In Progress', 'Resolved', 'Escalated'].map(value => <option key={value} value={value}>{value}</option>)}
                          </select>
                        </div>
                        <div>
                           <label className="block text-sm font-semibold text-slate-700 mb-2">Official note for the agent and citizen</label>
                          <textarea value={note} onChange={event => setNote(event.target.value)} maxLength={2000} rows={4} placeholder="Describe the work completed, next action, or reason for escalation..." className="w-full rounded-xl border border-slate-200 px-4 py-3 bg-white outline-none resize-none focus:ring-2 focus:ring-primary-500" />
                          <p className="text-xs text-slate-400 text-right mt-1">{note.length}/2000</p>
                        </div>
                        <div>
                           <label className="block text-sm font-semibold text-slate-700 mb-2">Progress / resolution photo</label>
                           <p className="mb-2 text-xs text-slate-500">The Response Agent analyzes this image, estimates completion and stores the evidence with the case.</p>
                          {photoDataUrl ? <div className="relative inline-block"><img src={photoDataUrl} alt="Resolution preview" className="max-h-48 rounded-xl border border-slate-200" /><button type="button" onClick={() => setPhotoDataUrl('')} className="absolute -top-2 -right-2 p-1.5 rounded-full bg-white shadow text-slate-600 hover:text-red-600"><Icon name="x" size={15} /></button></div> : <label className="cursor-pointer inline-flex items-center gap-2 rounded-xl border border-dashed border-primary-300 bg-white px-4 py-3 text-sm font-semibold text-primary-700 hover:bg-primary-50"><Icon name="camera" size={17} /> Upload resolution photo<input type="file" accept="image/*" capture="environment" onChange={handlePhoto} className="hidden" /></label>}
                        </div>
                        <button type="submit" disabled={actionLoading === 'save'} className="w-full inline-flex items-center justify-center gap-2 rounded-xl bg-primary-600 px-4 py-3 text-sm font-semibold text-white hover:bg-primary-700 disabled:opacity-60"><Icon name="save" size={17} /> {actionLoading === 'save' ? 'Saving update...' : 'Save update'}</button>
                       </form>
                      </>
                    )}

                    <div>
                      <h3 className="font-semibold text-slate-900 mb-4">Case timeline</h3>
                      <div className="space-y-0">
                        {timeline.slice().reverse().map((item, index) => <div key={`${item.time}-${index}`} className="flex gap-3"><div className="flex flex-col items-center"><div className="w-8 h-8 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center"><Icon name={item.done ? 'check-circle' : 'clock'} size={16} /></div>{index < timeline.length - 1 && <div className="w-0.5 flex-1 min-h-[30px] bg-slate-200" />}</div><div className="pb-5"><div className="font-medium text-slate-800 text-sm">{item.title}</div><div className="text-sm text-slate-500 mt-0.5">{item.desc}</div><div className="text-xs text-slate-400 mt-1">{item.time}</div></div></div>)}
                      </div>
                    </div>

                    {!!selectedCase.officialNotes?.length && <div><h3 className="font-semibold text-slate-900 mb-3">Previous official notes</h3><div className="space-y-3">{selectedCase.officialNotes.slice().reverse().map((item, index) => <div key={`${item.createdAt}-${index}`} className="rounded-xl bg-slate-50 border border-slate-100 p-4"><p className="text-sm text-slate-700">{item.text}</p><p className="text-xs text-slate-400 mt-2">{item.author?.name || item.author?.email} · {formatDate(item.createdAt)}</p></div>)}</div></div>}
                  </div>
                </>
              )}
            </section>
          </div>
        </div>
      );
    }

    // ========== DASHBOARD ==========
    function Dashboard({ lang }) {
      const t = translations[lang];
      const [filter, setFilter] = useState('all');
      const [complaints, setComplaints] = useState([]);
      const [selectedCase, setSelectedCase] = useState(null);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const fallbackComplaints = [
        { id: 'CR-482917', category: lang === 'te' ? 'రోడ్లు & గుంతలు' : lang === 'hi' ? 'सड़क और गड्ढे' : 'Roads & Potholes', location: 'Main Road, Ward 12', priority: lang === 'te' ? 'క్లిష్టమైన' : lang === 'hi' ? 'गंभीर' : 'Critical', score: 92, status: lang === 'te' ? 'పురోగతిలో' : lang === 'hi' ? 'प्रगति पर' : 'In Progress', age: '3 days' },
        { id: 'CR-481203', category: lang === 'te' ? 'డ్రైనేజీ' : lang === 'hi' ? 'जल निकासी' : 'Drainage & Flooding', location: 'Sector 7 Market', priority: lang === 'te' ? 'ఎక్కువ' : lang === 'hi' ? 'उच्च' : 'High', score: 81, status: lang === 'te' ? 'కేటాయించబడింది' : lang === 'hi' ? 'आवंटित' : 'Assigned', age: '1 day' },
        { id: 'CR-479881', category: lang === 'te' ? 'స్ట్రీట్‌లైట్లు' : lang === 'hi' ? 'स्ट्रीटलाइट' : 'Streetlights', location: 'Park Avenue', priority: lang === 'te' ? 'మధ్యస్థం' : lang === 'hi' ? 'मध्यम' : 'Medium', score: 54, status: lang === 'te' ? 'పెండింగ్' : lang === 'hi' ? 'लंबित' : 'Pending', age: '5 days' },
        { id: 'CR-478112', category: lang === 'te' ? 'వ్యర్థాల నిర్వహణ' : lang === 'hi' ? 'कचरा प्रबंधन' : 'Waste Management', location: 'Residential Colony B', priority: lang === 'te' ? 'ఎక్కువ' : lang === 'hi' ? 'उच्च' : 'High', score: 76, status: lang === 'te' ? 'ఎస్కలేటెడ్' : lang === 'hi' ? 'एस्केलेटेड' : 'Escalated', age: '7 days' },
      ];
      useEffect(() => {
        let active = true;
        apiRequest('/complaints')
          .then(records => { if (active) setComplaints(records); })
          .catch(requestError => { if (active) setError(requestError.message); })
          .finally(() => { if (active) setLoading(false); });
        return () => { active = false; };
      }, []);

      const liveComplaints = complaints.map(c => ({
        ...c,
        score: c.impactScore,
        age: c.createdAt ? `${Math.max(0, Math.floor((Date.now() - new Date(c.createdAt).getTime()) / 86400000))} days` : '—',
      }));
      const filtered = filter === 'all' ? liveComplaints : liveComplaints.filter(c => c.priority.toLowerCase().includes(filter) || (filter === 'critical' && c.score > 90));
      const openCases = liveComplaints.filter(c => !['Resolved'].includes(c.status)).length;
      const criticalCases = liveComplaints.filter(c => c.score > 90).length;
      const escalatedCases = liveComplaints.filter(c => c.status === 'Escalated').length;
      const resolvedToday = liveComplaints.filter(c => c.status === 'Resolved' && c.updatedAt && new Date(c.updatedAt).toDateString() === new Date().toDateString()).length;

      return (
        <div className="max-w-7xl mx-auto px-4 py-10 animate-fade-in">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div>
              <h1 className="text-3xl font-bold text-slate-900">{t.officerDashboardTitle}</h1>
              <p className="text-slate-600 mt-1">{t.liveCases}</p>
            </div>
            <div className="flex gap-2 flex-wrap">
              {['all', 'critical', 'high', 'medium'].map(f => (
                <button key={f} onClick={() => setFilter(f)}
                  className={`px-4 py-2 rounded-xl text-sm font-semibold capitalize transition-all ${
                    filter === f ? 'bg-primary-600 text-white shadow-md' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-50'
                  }`}>
                  {t[f] || f}
                </button>
              ))}
            </div>
          </div>

          {error && <div className="mb-6 rounded-2xl bg-red-50 border border-red-100 px-5 py-4 text-sm text-red-700">{error}</div>}
          {loading && <div className="mb-6 rounded-2xl bg-blue-50 border border-blue-100 px-5 py-4 text-sm text-blue-700">Loading complaints from MongoDB…</div>}

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
            {[
              { label: t.openCases, value: openCases, icon: 'clock', color: 'bg-blue-50 text-blue-600' },
              { label: t.critical, value: criticalCases, icon: 'alert-triangle', color: 'bg-red-50 text-red-600' },
              { label: t.escalated, value: escalatedCases, icon: 'arrow-up-right', color: 'bg-orange-50 text-orange-600' },
              { label: t.resolvedToday, value: resolvedToday, icon: 'check-circle', color: 'bg-emerald-50 text-emerald-600' },
           ].map(k => (
              <div key={k.label} className="card-hover bg-white rounded-2xl border border-slate-100 p-5 shadow-soft">
                <div className={`w-11 h-11 rounded-xl flex items-center justify-center ${k.color}`}>
                  <Icon name={k.icon} size={22} />
                </div>
                <div className="mt-4 text-2xl font-bold text-slate-900">{k.value}</div>
                <div className="text-sm text-slate-500 font-medium mt-0.5">{k.label}</div>
              </div>
             ))}
           </div>

           <AdminAssistanceChat />

           <div className="bg-white rounded-3xl border border-slate-100 shadow-soft overflow-hidden">
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead className="bg-slate-50/80 border-b border-slate-100">
                  <tr>
                    {[t.caseId, t.categoryCol, t.locationCol, t.priorityCol, t.statusCol, t.ageCol, t.actionCol].map(h => (
                      <th key={h} className="text-left px-5 py-4 font-semibold text-slate-600">{h}</th>
                    ))}
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-50">
                  {filtered.map(c => (
                    <tr key={c.id} className="hover:bg-slate-50/50 transition-colors">
                      <td className="px-5 py-4 font-mono font-semibold text-primary-700">{c.id}</td>
                      <td className="px-5 py-4">{c.category}</td>
                      <td className="px-5 py-4 text-slate-600">{c.location}</td>
                      <td className="px-5 py-4">
                        <span className={`inline-flex px-2.5 py-1 rounded-full text-xs font-semibold ${
                          c.score > 90 ? 'bg-red-50 text-red-700' : c.score > 70 ? 'bg-orange-50 text-orange-700' : 'bg-slate-100 text-slate-700'
                        }`}>
                          {c.priority} ({c.score})
                        </span>
                      </td>
                      <td className="px-5 py-4 text-slate-700">{c.status}</td>
                      <td className="px-5 py-4 text-slate-500">{c.age}</td>
                      <td className="px-5 py-4">
                         <button type="button" onClick={() => setSelectedCase(c)} className="text-primary-600 font-semibold hover:text-primary-700 hover:underline">{t.view}</button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
           </div>
           {selectedCase && <ComplaintDetailCard record={selectedCase} title="Administration case details" onClose={() => setSelectedCase(null)} />}
         </div>
        </div>
      );
    }

    // ========== ANALYTICS ==========
    function Analytics({ lang }) {
      const t = translations[lang];
      const [insights, setInsights] = useState(null);
      const [insightsLoading, setInsightsLoading] = useState(true);
      const [insightsError, setInsightsError] = useState('');
      useEffect(() => {
        let active = true;
        apiRequest('/agent/insights')
          .then(data => { if (active) setInsights(data); })
          .catch(error => { if (active) setInsightsError(error.message); })
          .finally(() => { if (active) setInsightsLoading(false); });
        return () => { active = false; };
      }, []);
      const hotspots = [
        { area: 'Ward 12 – Main Road', count: 28, type: lang === 'te' ? 'రోడ్లు' : lang === 'hi' ? 'सड़क' : 'Roads' },
        { area: 'Sector 7 Market', count: 19, type: lang === 'te' ? 'డ్రైనేజీ' : lang === 'hi' ? 'जल निकासी' : 'Drainage' },
        { area: 'Colony B', count: 15, type: lang === 'te' ? 'వ్యర్థాలు' : lang === 'hi' ? 'कचरा' : 'Waste' },
        { area: 'Park Avenue', count: 12, type: lang === 'te' ? 'స్ట్రీట్‌లైట్లు' : lang === 'hi' ? 'स्ट्रीटलाइट' : 'Streetlights' },
      ];
      const categories = [
        { name: lang === 'te' ? 'రోడ్లు & గుంతలు' : lang === 'hi' ? 'सड़क और गड्ढे' : 'Roads & Potholes', value: 42, color: 'bg-blue-500' },
        { name: lang === 'te' ? 'వ్యర్థాల నిర్వహణ' : lang === 'hi' ? 'कचरा प्रबंधन' : 'Waste Management', value: 28, color: 'bg-teal-500' },
        { name: lang === 'te' ? 'డ్రైనేజీ' : lang === 'hi' ? 'जल निकासी' : 'Drainage', value: 19, color: 'bg-amber-500' },
        { name: lang === 'te' ? 'స్ట్రీట్‌లైట్లు' : lang === 'hi' ? 'स्ट्रीटलाइट' : 'Streetlights', value: 15, color: 'bg-purple-500' },
        { name: lang === 'te' ? 'నీటి సరఫరా' : lang === 'hi' ? 'जल आपूर्ति' : 'Water Supply', value: 11, color: 'bg-cyan-500' },
      ];

      const liveCategories = insights?.categoryBreakdown?.length
        ? insights.categoryBreakdown.map((item, index) => ({ name: item.category, value: insights.totalComplaints ? Math.round((item.count / insights.totalComplaints) * 100) : 0, color: ['bg-blue-500', 'bg-teal-500', 'bg-amber-500', 'bg-purple-500', 'bg-cyan-500'][index % 5] }))
        : categories;
      const liveHotspots = insights?.hotspots?.length
        ? insights.hotspots.map(item => ({ area: item.location, count: item.count, type: item.category }))
        : hotspots;
      const recurringCards = insights?.recurringProblems?.length
        ? insights.recurringProblems.slice(0, 4).map(item => ({ title: `${item.category} · ${item.location}`, text: `${item.count} reports found${item.open ? `, ${item.open} still open` : ''}. ${item.recommendation}` }))
        : [
            { title: 'Ward 12 Road Network', text: '28 pothole complaints in 45 days. Recommended: Full resurfacing assessment.' },
            { title: 'Sector 7 Drainage', text: 'Recurring flooding after moderate rain. Recommended: Capacity upgrade study.' },
          ];

      return (
        <div className="max-w-7xl mx-auto px-4 py-10 animate-fade-in">
          <h1 className="text-3xl font-bold text-slate-900 mb-2">{t.cityAnalyticsTitle}</h1>
          <p className="text-slate-600 mb-8">{t.recurringProblems}</p>
          {insightsLoading && <div className="mb-6 rounded-2xl bg-blue-50 border border-blue-100 px-5 py-4 text-sm text-blue-700">Response Agent is analyzing live complaint patterns...</div>}
          {insightsError && <div className="mb-6 rounded-2xl bg-amber-50 border border-amber-100 px-5 py-4 text-sm text-amber-800">Live insights unavailable; showing the demo pattern set.</div>}

          <div className="grid lg:grid-cols-3 gap-6 mb-8">
            <div className="lg:col-span-2 bg-white rounded-3xl border border-slate-100 shadow-soft p-6">
              <h2 className="font-semibold text-lg mb-5 flex items-center gap-2">
                <Icon name="trending-up" size={20} className="text-primary-600" /> {t.complaintsByCategory}
              </h2>
              <div className="space-y-5">
                 {liveCategories.map(item => (
                  <div key={item.name}>
                    <div className="flex justify-between text-sm mb-1.5">
                      <span className="font-medium text-slate-700">{item.name}</span>
                      <span className="font-semibold text-slate-900">{item.value}%</span>
                    </div>
                    <div className="h-2.5 bg-slate-100 rounded-full overflow-hidden">
                      <div className={`h-full ${item.color} rounded-full transition-all duration-700`} style={{ width: `${item.value}%` }} />
                    </div>
                  </div>
                ))}
              </div>
            </div>

            <div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-6">
              <h2 className="font-semibold text-lg mb-5 flex items-center gap-2">
                <Icon name="alert-circle" size={20} className="text-orange-500" /> {t.topHotspots}
              </h2>
              <div className="space-y-4">
                 {liveHotspots.map((h, i) => (
                  <div key={h.area} className="flex items-start gap-3">
                    <div className="w-8 h-8 rounded-full bg-slate-100 flex items-center justify-center text-sm font-bold text-slate-600 shrink-0">
                      {i + 1}
                    </div>
                    <div>
                      <div className="font-medium text-slate-900">{h.area}</div>
                      <div className="text-sm text-slate-500">{h.count} · {h.type}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          <div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-6">
            <h2 className="font-semibold text-lg mb-2 flex items-center gap-2">
              <Icon name="map" size={20} className="text-primary-600" /> {t.recurringInsightsTitle}
            </h2>
            <p className="text-slate-600 text-sm mb-5">{t.recurringDesc}</p>
            <div className="grid sm:grid-cols-2 gap-4">
              {insights?.recurringProblems?.length ? recurringCards.map((item, index) => <div key={item.title} className={`${index % 2 === 0 ? 'bg-amber-50 border-amber-100 text-amber-900' : 'bg-blue-50 border-blue-100 text-blue-900'} border rounded-2xl p-5`}><div className="font-semibold">{item.title}</div><p className="text-sm mt-1.5 leading-relaxed">{item.text}</p></div>) : null}
              <div className={`${insights?.recurringProblems?.length ? 'hidden ' : ''}bg-amber-50 border border-amber-100 rounded-2xl p-5`}>
                <div className="font-semibold text-amber-900">Ward 12 Road Network</div>
                <p className="text-sm text-amber-800 mt-1.5 leading-relaxed">
                  {lang === 'te' ? '45 రోజుల్లో 28 గుంత ఫిర్యాదులు. సిఫార్సు: పూర్తి రీసర్ఫేసింగ్ అసెస్‌మెంట్.' : lang === 'hi' ? '45 दिनों में 28 गड्ढे की शिकायतें। सुझाव: पूर्ण रिसरफेसिंग मूल्यांकन।' : '28 pothole complaints in 45 days. Recommended: Full resurfacing assessment.'}
                </p>
              </div>
              <div className={`${insights?.recurringProblems?.length ? 'hidden ' : ''}bg-blue-50 border border-blue-100 rounded-2xl p-5`}>
                <div className="font-semibold text-blue-900">Sector 7 Drainage</div>
                <p className="text-sm text-blue-800 mt-1.5 leading-relaxed">
                  {lang === 'te' ? 'మధ్యస్థ వర్షం తర్వాత పునరావృత వరదలు. సిఫార్సు: కెపాసిటీ అప్‌గ్రేడ్ స్టడీ.' : lang === 'hi' ? 'मध्यम बारिश के बाद आवर्ती बाढ़। सुझाव: क्षमता उन्नयन अध्ययन।' : 'Recurring flooding after moderate rain. Recommended: Capacity upgrade study.'}
                </p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ========== ADMIN NOTIFICATIONS ==========
    function AdminNotifications() {
      const [requests, setRequests] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState('');
      const [actionId, setActionId] = useState('');

      const loadRequests = async () => {
        setError('');
        try {
          const response = await apiRequest('/admin/notifications');
          setRequests(response.requests || []);
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { loadRequests(); }, []);

      const decide = async (requestId, decision) => {
        setActionId(requestId);
        setError('');
        try {
          await apiRequest(`/admin/official-requests/${requestId}/${decision}`, { method: 'POST' });
          setRequests(current => current.filter(request => request.requestId !== requestId));
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setActionId('');
        }
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-10 animate-fade-in">
          <div className="flex items-center justify-between gap-4 mb-8">
            <div>
              <h1 className="text-3xl font-bold text-slate-900">Notifications</h1>
              <p className="text-slate-600 mt-1">Review government-official account requests.</p>
            </div>
            <button type="button" onClick={loadRequests} className="inline-flex items-center gap-2 px-4 py-2 rounded-xl border border-slate-200 bg-white text-sm font-semibold text-slate-700 hover:bg-slate-50">
              <Icon name="refresh-cw" size={16} /> Refresh
            </button>
          </div>

          {error && <div className="mb-6 rounded-2xl bg-red-50 border border-red-100 px-5 py-4 text-sm text-red-700">{error}</div>}
          {loading && <div className="rounded-2xl bg-blue-50 border border-blue-100 px-5 py-4 text-sm text-blue-700">Loading notifications...</div>}
          {!loading && !requests.length && <div className="bg-white rounded-3xl border border-slate-100 shadow-soft p-10 text-center text-slate-500">No pending notifications.</div>}

          <div className="space-y-5">
            {requests.map(request => (
              <article key={request.requestId} className="bg-white rounded-3xl border border-slate-100 shadow-soft p-6">
                <div className="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
                  <div>
                    <div className="flex items-center gap-2">
                      <div className="w-10 h-10 rounded-xl bg-amber-50 text-amber-600 flex items-center justify-center"><Icon name="user-plus" size={20} /></div>
                      <div>
                        <h2 className="font-bold text-slate-900">Government official signup request</h2>
                        <p className="text-xs text-slate-500 mt-0.5">{request.createdAt ? new Date(request.createdAt).toLocaleString() : ''}</p>
                      </div>
                    </div>
                    <div className="grid sm:grid-cols-2 gap-x-8 gap-y-3 mt-6 text-sm">
                      <div><span className="block text-slate-500">Name</span><strong>{request.name}</strong></div>
                      <div><span className="block text-slate-500">Email</span><strong>{request.email}</strong></div>
                      <div><span className="block text-slate-500">Phone</span><strong>{request.phone}</strong></div>
                      <div><span className="block text-slate-500">Department</span><strong>{request.department || 'Not provided'}</strong></div>
                      <div><span className="block text-slate-500">Location</span><strong>{request.location}</strong></div>
                    </div>
                  </div>
                  <div className="flex sm:flex-col gap-2 shrink-0">
                    <button type="button" disabled={actionId === request.requestId} onClick={() => decide(request.requestId, 'approve')} className="inline-flex items-center justify-center gap-2 rounded-xl bg-emerald-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-emerald-700 disabled:opacity-60">
                      <Icon name="check" size={16} /> Accept
                    </button>
                    <button type="button" disabled={actionId === request.requestId} onClick={() => decide(request.requestId, 'reject')} className="inline-flex items-center justify-center gap-2 rounded-xl bg-red-50 px-4 py-2.5 text-sm font-semibold text-red-700 hover:bg-red-100 disabled:opacity-60">
                      <Icon name="x" size={16} /> Reject
                    </button>
                  </div>
                </div>
              </article>
            ))}
          </div>
        </div>
      );
    }

    // ========== MAIN APP ==========
    function App() {
      const [user, setUser] = useState(null);
      const [page, setPage] = useState('home');
      const [lang, setLang] = useState('en');
      const [authPage, setAuthPage] = useState('login');
      const [signupRole, setSignupRole] = useState('citizen');

      const handleLogin = (userData) => {
        window.civicResolveToken = userData.authToken;
        setUser(userData);
        setPage('home');
      };

      if (!user) {
        return authPage === 'signup'
          ? <Signup initialRole={signupRole} onBack={() => setAuthPage('login')} lang={lang} setLang={setLang} />
          : <Login onLogin={handleLogin} onSignup={(role) => { setSignupRole(role); setAuthPage('signup'); }} lang={lang} setLang={setLang} />;
      }

      return (
        <div className="min-h-screen flex flex-col">
          <Navbar page={page} setPage={setPage} user={user} onLogout={() => { window.civicResolveToken = ''; setUser(null); }} lang={lang} setLang={setLang} />
          <main className="flex-1">
            {page === 'home' && <Home setPage={setPage} user={user} lang={lang} />}
            {page === 'submit' && <SubmitComplaint lang={lang} user={user} />}
            {page === 'track' && <TrackComplaint lang={lang} />}
            {page === 'dashboard' && (user.role === 'official' ? <OfficialDashboard lang={lang} user={user} /> : <Dashboard lang={lang} />)}
            {page === 'analytics' && <Analytics lang={lang} />}
            {page === 'notifications' && user.role === 'admin' && <AdminNotifications />}
          </main>
          <Footer lang={lang} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
