      const headers = { 'Content-Type': 'application/json', ...(options.headers || {}) };
      if (window.civicResolveToken) headers.Authorization = `Bearer ${window.civicResolveToken}`;
      const response = await fetch(`${API_BASE}${path}`, {
        ...options,
        headers,
      });
      const payload = await response.json().catch(() => ({}));

      return payload;

        track: "ట్రాక్", searching: "వెతుకుతోంది...", progressTimeline: "పురోగతి టైమ్‌లైన్",
        officerDashboardTitle: "అధికారి డాష్‌బోర్డ్", liveCases: "విభాగాలలో లైవ్ కేసులు", all: "అన్నీ", critical: "క్లిష్టమైన",

        caseId: "కేస్ ఐడి", categoryCol: "వర్గం", locationCol: "స్థానం", priorityCol: "ప్రాధాన్యత", statusCol: "స్థితి", ageCol: "వయస్సు", actionCol: "చర్య", view: "చూడండి",
        cityAnalyticsTitle: "నగర విశ్లేషణ", recurringProblems: "పునరావృత సమస్యలు & హాట్‌స్పాట్ ఇంటెలిజెన్స్",
        complaintsByCategory: "వర్గం ప్రకారం ఫిర్యాదులు (గత 30 రోజులు)", topHotspots: "టాప్ హాట్‌స్పాట్‌లు",
        recurringInsightsTitle: "పునరావృత సమస్య అంతర్దృష్టులు", recurringDesc: "AI సారూప్య ఫిర్యాదుల క్లస్టర్‌లను గుర్తించింది. ఈ ప్రదేశాలకు తాత్కాలిక మరమ్మతులకు బదులుగా శాశ్వత మౌలిక సదుపాయాల పరిష్కారాలు అవసరం కావచ్చు.",
        footer: "© 2026 CivicResolve. పారదర్శక, పౌర-మొదటి పాలన కోసం నిర్మించబడింది.",
        listening: "వినిపిస్తోంది... ఇప్పుడు మాట్లాడండి", micUnsupported: "ఈ బ్రౌజర్‌లో స్పీచ్ రికగ్నిషన్ మద్దతు లేదు"
      }
    };

    // ========== ICON ==========
    const Icon = ({ name, size = 20, className = "" }) => {
      // Render Lucide's icon nodes through React. Calling lucide.createIcons()
      // here mutates React-owned DOM and causes NotFoundError on auth/page
      // transitions when React reconciles the replaced <i> elements.
      const iconKey = String(name || '').split('-').map(part => part.charAt(0).toUpperCase() + part.slice(1)).join('');
      const iconNodes = window.lucide && window.lucide.icons
        ? (window.lucide.icons[iconKey] || window.lucide.icons.Circle)
        : [['circle', { cx: '12', cy: '12', r: '10' }]];
      return (
        <svg
          width={size}
          height={size}
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          strokeWidth="2"
          strokeLinecap="round"
          strokeLinejoin="round"
          aria-hidden="true"
          className={className}
        >
          {iconNodes.map(([tag, attributes], index) => React.createElement(tag, { ...attributes, key: index }))}
        </svg>
      );
    };

    // ========== LANGUAGE SWITCHER ==========
    function LanguageSwitcher({ lang, setLang, dark = false }) {
      return (
        <div className={`flex items-center rounded-full p-1 text-sm font-medium ${dark ? 'auth-language-switcher bg-white/15 backdrop-blur' : 'bg-slate-100'}`}>
          {['en', 'hi', 'te'].map(l => (
            <button key={l} onClick={() => setLang(l)}
              className={`px-3 py-1.5 rounded-full transition-all duration-200 ${
                lang === l 
                  ? (dark ? 'bg-white text-primary-700 shadow-sm' : 'bg-white text-primary-700 shadow-sm') 
                  : (dark ? 'text-white/70 hover:text-white' : 'text-slate-500 hover:text-slate-800')
              }`}>
              {l === 'en' ? 'EN' : l === 'hi' ? 'हिं' : 'తె'}
            </button>
          ))}
        </div>
      );
    }

    function AuthBrand({ compact = false }) {
      return (
        <div className={`auth-brand ${compact ? 'auth-brand-compact' : ''}`}>
          <div className="auth-seal" aria-hidden="true">
            <span>CR</span>
            <small>REGISTERED</small>
          </div>
          <h1>CivicResolve AI</h1>
          {!compact && <p>REGISTERED PUBLIC GRIEVANCE SYSTEM</p>}
        </div>
      );
    }

    // ========== LOGIN ==========
    function Login({ onLogin, onSignup, lang, setLang }) {
      const t = translations[lang];
      const [authStep, setAuthStep] = useState('welcome');
      const [role, setRole] = useState(null);
      const [mode, setMode] = useState('email');
      const [value, setValue] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const [notice, setNotice] = useState('');
      const [loading, setLoading] = useState(false);
      const [forgotEmail, setForgotEmail] = useState('');
      const [forgotOtp, setForgotOtp] = useState('');
      const [newPassword, setNewPassword] = useState('');
      const [confirmNewPassword, setConfirmNewPassword] = useState('');

      const roles = [
        { id: 'citizen', icon: 'user-round', title: t.citizen, desc: lang === 'en' ? 'Report civic problems' : t.citizenDesc },
        { id: 'official', icon: 'landmark', title: t.official, desc: lang === 'en' ? 'Resolve assigned cases' : t.officialDesc },
        { id: 'admin', icon: 'sliders-horizontal', title: lang === 'en' ? 'Administrator' : t.admin, desc: lang === 'en' ? 'Monitor & manage system' : t.adminDesc }
      ];
      const currentRole = roles.find(r => r.id === role);

      const validate = () => {
        if (!value.trim()) {
          setError(lang === 'te' ? 'దయచేసి మీ ఇమెయిల్ లేదా మొబైల్ నంబర్ నమోదు చేయండి' : lang === 'hi' ? 'कृपया अपना ईमेल या मोबाइल नंबर दर्ज करें' : 'Please enter your email or mobile number');
          return false;
        }
        if (!password) {
          setError('Please enter your password.');
          return false;
        }
        if (mode === 'email' && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
          setError(lang === 'te' ? 'దయచేసి చెల్లుబాటు అయ్యే ఇమెయిల్ చిరునామా నమోదు చేయండి' : lang === 'hi' ? 'कृपया एक वैध ईमेल पता दर्ज करें' : 'Please enter a valid email address');
          return false;
        }
        if (mode === 'mobile' && !/^[6-9]\d{9}$/.test(value.replace(/\s+/g, ''))) {
          setError(lang === 'te' ? 'దయచేసి చెల్లుబాటు అయ్యే 10 అంకెల మొబైల్ నంబర్ నమోదు చేయండి' : lang === 'hi' ? 'कृपया एक वैध 10 अंकों का मोबाइल नंबर दर्ज करें' : 'Please enter a valid 10-digit mobile number');
          return false;
        }
        setError('');
        return true;
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!validate()) return;
        setLoading(true);
        setNotice('');
        try {
          const response = await apiRequest('/auth/signin', {
            method: 'POST',
            body: JSON.stringify({ identifier: value.trim(), type: mode, password, requestedRole: role }),
          });
          onLogin({ ...response.user, authToken: response.token });
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setLoading(false);
        }
      };

      const openForgotPassword = () => {
        setForgotEmail(mode === 'email' ? value.trim() : '');
        setForgotOtp('');
        setNewPassword('');
        setConfirmNewPassword('');
        setError('');
        setNotice('');
        setAuthStep('forgot-request');
      };

      const requestPasswordReset = async (event) => {
        event.preventDefault();
        const email = forgotEmail.trim().toLowerCase();
        if (!/^\S+@\S+\.\S+$/.test(email)) {
          setError('Enter the email used for this account.');
          return;
        }
        setLoading(true);
        setError('');
        try {
          const response = await apiRequest('/auth/forgot-password/request-otp', {
            method: 'POST',
            body: JSON.stringify({ email, requestedRole: role }),
          });
          setForgotEmail(email);
          setForgotOtp('');
          setNotice(response.message || 'A reset OTP was sent to your registered email.');
          setAuthStep('forgot-reset');
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setLoading(false);
        }
      };

      const resetPassword = async (event) => {
        event.preventDefault();
        if (!/^\d{6}$/.test(forgotOtp)) {
          setError('Enter the 6-digit reset OTP.');
          return;
        }
        if (newPassword.length < 8) {
          setError('New password must be at least 8 characters.');
          return;
        }
        if (newPassword !== confirmNewPassword) {
          setError('Passwords do not match.');
          return;
        }
        setLoading(true);
        setError('');
        try {
          const response = await apiRequest('/auth/forgot-password/reset', {
            method: 'POST',
            body: JSON.stringify({ email: forgotEmail.trim().toLowerCase(), otp: forgotOtp, newPassword }),
          });
          setValue(forgotEmail.trim().toLowerCase());
          setPassword('');
          setNotice(response.message || 'Password updated successfully.');
          setAuthStep('login');
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setLoading(false);
        }
      };

      if (authStep === 'welcome') {
        return (
          <div className="auth-screen auth-role-screen">
            <div className="auth-language"><LanguageSwitcher lang={lang} setLang={setLang} dark={true} /></div>
            <div className="auth-content auth-role-content animate-fade-in">
              <AuthBrand />
              <div className="max-w-2xl mx-auto mt-10 rounded-3xl border border-white/10 bg-white/95 p-7 text-center shadow-2xl sm:p-10">
                <div className="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-primary-50 text-primary-700 shadow-sm"><Icon name="bot" size={34} /></div>
                <p className="mt-6 text-xs font-bold uppercase tracking-[0.2em] text-primary-600">AI-powered civic service</p>
                <h2 className="mt-3 text-3xl font-bold text-slate-900 sm:text-4xl">Welcome to the Civic AI Agent</h2>
                <p className="mx-auto mt-4 max-w-xl text-base leading-relaxed text-slate-600">Your intelligent civic-response assistant. It helps citizens report issues, routes cases to officials and keeps every resolution transparent.</p>
                <div className="mt-7 grid gap-3 text-left sm:grid-cols-3">
                  {[
                    ['sparkles', 'Smart intake', 'Text, image and GPS complaint capture'],
                    ['route', 'Autonomous routing', 'Priority and department decisions'],
                    ['activity', 'Always following up', 'Tracking, escalation and insights'],
                  ].map(([icon, title, description]) => (
                    <div key={title} className="rounded-2xl border border-slate-100 bg-slate-50 p-4">
                      <Icon name={icon} size={19} className="text-primary-600" />
                      <strong className="mt-3 block text-sm text-slate-800">{title}</strong>
                      <span className="mt-1 block text-xs leading-relaxed text-slate-500">{description}</span>
                    </div>
                  ))}
                </div>
                <button type="button" onClick={() => setAuthStep('role')} className="auth-submit mt-8">Enter Civic AI Agent <Icon name="arrow-right" size={18} /></button>
              </div>
            </div>
          </div>
        );
      }

      // Recover safely if a stale session or an unexpected navigation reaches
      // authentication without a valid role selected.
      if (authStep === 'role' || !currentRole) {
        return (
          <div className="auth-screen auth-role-screen">
            <div className="auth-language"><LanguageSwitcher lang={lang} setLang={setLang} dark={true} /></div>
            <div className="auth-content auth-role-content animate-fade-in">
              <AuthBrand />
              <p className="auth-prompt">{lang === 'en' ? 'Which role are you going to use?' : t.whoAreYou}</p>
              <div className="auth-role-grid">
                {roles.map(r => (
                  <button type="button" key={r.id} onClick={() => { setRole(r.id); setAuthStep('access'); }} className={`auth-role-card auth-role-card-${r.id}`}>
                    <div className="auth-role-icon"><Icon name={r.icon} size={21} /></div>
                    <h2>{r.title}</h2>
                    <p>{r.desc}</p>
                  </button>
                ))}
              </div>
              <button type="button" onClick={() => setAuthStep('welcome')} className="mx-auto mt-8 block text-sm font-semibold text-primary-100 hover:text-white">← Back to welcome</button>
            </div>
          </div>
        );
      }

      if (authStep === 'access' && currentRole) {
        return (
          <div className="auth-screen auth-login-screen">
            <div className="auth-language"><LanguageSwitcher lang={lang} setLang={setLang} dark={true} /></div>
            <div className="auth-content auth-login-content animate-slide-up">
              <AuthBrand compact />
              <div className={`auth-role-pill auth-role-pill-${role}`}><Icon name={currentRole.icon} size={15} /><span>{currentRole.title}</span></div>
              <div className="auth-panel">
                <div className="text-center">
                  <div className="mx-auto flex h-12 w-12 items-center justify-center rounded-2xl bg-primary-50 text-primary-700"><Icon name="shield-check" size={24} /></div>
                  <h2 className="mt-5 text-2xl font-bold text-slate-900">How would you like to continue?</h2>
                  <p className="mt-2 text-sm leading-relaxed text-slate-500">The Civic AI Agent will open the correct workspace for your selected role.</p>
                  {role === 'official' && <p className="mt-3 rounded-xl bg-amber-50 px-4 py-3 text-left text-xs leading-relaxed text-amber-800"><strong>Government official login:</strong> use this sign-in button after your account has been approved by the administrator.</p>}
                </div>
                <div className="mt-7 space-y-3">
                  <button type="button" onClick={() => { setAuthStep('login'); setMode('email'); setValue(''); setPassword(''); setError(''); }} className="auth-submit"><Icon name="log-in" size={18} /> Sign in as {currentRole.title}</button>
                  {role !== 'admin' && <button type="button" onClick={() => onSignup(role)} className="flex w-full items-center justify-center gap-2 rounded-xl border border-primary-200 bg-primary-50 px-4 py-3.5 text-sm font-semibold text-primary-700 transition-colors hover:bg-primary-100"><Icon name="user-plus" size={18} /> Create {currentRole.title} account</button>}
                  <button type="button" onClick={() => { setRole(null); setAuthStep('role'); }} className="w-full pt-2 text-sm font-semibold text-slate-500 hover:text-primary-700">Choose another role</button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (authStep === 'forgot-request' || authStep === 'forgot-reset') {
        const enteringNewPassword = authStep === 'forgot-reset';
        return (
          <div className="auth-screen auth-login-screen">
            <div className="auth-language"><LanguageSwitcher lang={lang} setLang={setLang} dark={true} /></div>
            <div className="auth-content auth-login-content animate-slide-up">
              <AuthBrand compact />
              <div className={`auth-role-pill auth-role-pill-${role}`}><Icon name={currentRole.icon} size={15} /><span>{currentRole.title}</span></div>
              <div className="auth-panel">
                <div className="auth-panel-header">
                  <h2>{enteringNewPassword ? 'Create a new password' : 'Forgot password?'}</h2>
                  <p>{enteringNewPassword ? 'Enter the OTP sent to your registered email address.' : 'We will send a one-time reset code to your registered email.'}</p>
                </div>
                {notice && <div className="mb-5 rounded-xl border border-emerald-100 bg-emerald-50 px-4 py-3 text-sm leading-relaxed text-emerald-800">{notice}</div>}
                {enteringNewPassword ? (
                  <form onSubmit={resetPassword} className="auth-form space-y-5">
                    <div>
                      <label>Registered email</label>
                      <div className="relative"><span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="mail" size={18} /></span><input className="auth-input" type="email" value={forgotEmail} onChange={event => setForgotEmail(event.target.value)} autoComplete="email" /></div>
                    </div>
                    <div>
                      <label>Email reset OTP</label>
                      <div className="relative"><span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="key-round" size={18} /></span><input className="auth-input" inputMode="numeric" pattern="[0-9]{6}" maxLength="6" value={forgotOtp} onChange={event => setForgotOtp(event.target.value.replace(/\D/g, '').slice(0, 6))} placeholder="Enter 6-digit OTP" autoFocus /></div>
                    </div>
                    <div>
                      <label>New password</label>
                      <div className="relative"><span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="lock" size={18} /></span><input className="auth-input" type="password" minLength="8" value={newPassword} onChange={event => setNewPassword(event.target.value)} autoComplete="new-password" /></div>
                    </div>
                    <div>
                      <label>Confirm new password</label>
                      <div className="relative"><span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="lock-keyhole" size={18} /></span><input className="auth-input" type="password" minLength="8" value={confirmNewPassword} onChange={event => setConfirmNewPassword(event.target.value)} autoComplete="new-password" /></div>
                    </div>
                    {error && <p className="text-sm text-red-600 flex items-center gap-1.5"><Icon name="alert-circle" size={14} /> {error}</p>}
                    <button type="submit" disabled={loading} className="auth-submit">{loading ? (<><Icon name="loader-2" size={20} className="animate-spin" /> Updating password...</>) : (<><Icon name="check" size={18} /> Update password</>)}</button>
                    <button type="button" onClick={() => { setAuthStep('forgot-request'); setError(''); setNotice(''); }} className="w-full text-sm font-semibold text-slate-500 hover:text-primary-700">Request a new OTP</button>
                  </form>
                ) : (
                  <form onSubmit={requestPasswordReset} className="auth-form space-y-5">
                    <div>
                      <label>Registered email</label>
                      <div className="relative"><span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="mail" size={18} /></span><input className="auth-input" type="email" value={forgotEmail} onChange={event => setForgotEmail(event.target.value)} placeholder="you@example.com" autoComplete="email" autoFocus /></div>
                    </div>
                    {error && <p className="text-sm text-red-600 flex items-center gap-1.5"><Icon name="alert-circle" size={14} /> {error}</p>}
                    <button type="submit" disabled={loading} className="auth-submit">{loading ? (<><Icon name="loader-2" size={20} className="animate-spin" /> Sending OTP...</>) : (<><Icon name="mail" size={18} /> Send reset OTP</>)}</button>
                  </form>
                )}
                <button type="button" onClick={() => { setAuthStep('login'); setError(''); setNotice(''); }} className="mt-5 w-full text-sm font-semibold text-slate-500 hover:text-primary-700">Back to {currentRole.title} sign in</button>
              </div>
            </div>
          </div>
        );
      }

      return (
        <div className="auth-screen auth-login-screen">
          <div className="auth-language"><LanguageSwitcher lang={lang} setLang={setLang} dark={true} /></div>

          <div className="auth-content auth-login-content animate-slide-up">
            <AuthBrand compact />
            <div className={`auth-role-pill auth-role-pill-${role}`}><Icon name={currentRole.icon} size={15} /><span>{currentRole.title}</span></div>

            <div className="auth-panel">
                <div className="auth-panel-header flex items-center justify-between mb-7">
                  <div>
                    <h2 className="text-xl font-bold text-slate-900">{t.welcome}</h2>
                    <p className="text-slate-500 text-sm mt-1">{t.enterDetails}</p>
                  </div>
                  <button onClick={() => { setRole(null); setAuthStep('role'); setMode('email'); setValue(''); setError(''); }}
                    className="auth-change-role text-sm text-primary-600 hover:text-primary-700 font-medium hover:underline">
                    {t.changeRole}
                  </button>
                </div>
                {notice && <div className="mb-5 rounded-xl border border-emerald-100 bg-emerald-50 px-4 py-3 text-sm leading-relaxed text-emerald-800">{notice}</div>}

                {role === 'official' && <div className="mb-6 rounded-xl border border-amber-100 bg-amber-50 px-4 py-3 text-sm leading-relaxed text-amber-800"><strong>Official account:</strong> enter the email and password from your approved government-official account. Accounts awaiting admin approval cannot sign in yet.</div>}

              <div className="auth-tabs flex bg-slate-100 rounded-xl p-1 mb-6">
                <button type="button" onClick={() => { setMode('email'); setValue(''); setPassword(''); setError(''); }}
                  className={`flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all ${mode === 'email' ? 'bg-white shadow text-primary-700' : 'text-slate-500 hover:text-slate-700'}`}>
                  {t.emailId}
                </button>
                {role !== 'admin' && <button type="button" onClick={() => { setMode('mobile'); setValue(''); setPassword(''); setError(''); }}
                  className={`flex-1 py-2.5 rounded-lg text-sm font-semibold transition-all ${mode === 'mobile' ? 'bg-white shadow text-primary-700' : 'text-slate-500 hover:text-slate-700'}`}>
                  {t.mobileNumber}
                </button>}
              </div>

              <form onSubmit={handleSubmit} className="auth-form space-y-5">
                <div>
                  <label className="block text-sm font-semibold text-slate-700 mb-2">
                    {mode === 'email' ? t.emailAddress : t.mobileNumber}
                  </label>
                  <div className="relative">
                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400">
                      <Icon name={mode === 'email' ? 'mail' : 'smartphone'} size={18} />
                    </span>
                    <input
                      className="auth-input"
                      type={mode === 'email' ? 'email' : 'tel'}
                      value={value}
                      onChange={e => setValue(e.target.value)}
                      placeholder={mode === 'email' ? 'you@example.com' : '9876543210'}
                      autoFocus
                    />
                  </div>
                  {error && <p className="mt-2 text-sm text-red-600 flex items-center gap-1.5"><Icon name="alert-circle" size={14} /> {error}</p>}
                </div>
                <div>
                  <label className="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                  <div className="relative">
                    <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"><Icon name="lock" size={18} /></span>
                    <input className="auth-input" type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder="Enter your password" autoComplete="current-password" />
                  </div>
                </div>
                <div className="flex justify-end -mt-2"><button type="button" onClick={openForgotPassword} className="text-sm font-semibold text-primary-600 hover:text-primary-700 hover:underline">Forgot password?</button></div>

                <button type="submit" disabled={loading} className="auth-submit">
                  {loading ? (<><Icon name="loader-2" size={20} className="animate-spin" /> {t.signingIn}</>) : (<><Icon name="log-in" size={18} /> {t.continueAs} {currentRole.title}</>)}
                </button>
              </form>
              <p className="auth-terms mt-6 text-center text-xs text-slate-400">{t.terms}</p>
              {role !== 'admin' && <button type="button" onClick={() => onSignup(role)} className="auth-signup-link mt-4 w-full text-sm font-semibold text-primary-600 hover:text-primary-700 hover:underline">
                New here? Create an account
              </button>}
            </div>
            <p className="auth-demo mt-6 text-center text-primary-200/80 text-sm">{t.demoNote}</p>
          </div>
        </div>
      );
    }

    // ========== SIGNUP ==========
    function Signup({ onBack, lang, setLang, initialRole = 'citizen' }) {
      const selectedRole = initialRole === 'official' ? 'official' : 'citizen';
      const officialDepartments = [
        { value: 'Public Works Department', label: 'Public Works Department — Roads & Potholes' },
        { value: 'Water and Drainage Department', label: 'Water and Drainage Department — Drainage & Water Supply' },
        { value: 'Solid Waste Management', label: 'Solid Waste Management — Garbage & Sanitation' },
        { value: 'Electrical Department', label: 'Electrical Department — Streetlights' },
        { value: 'Public Facilities Department', label: 'Public Facilities Department — Parks & Public Facilities' },
      ];
      const [form, setForm] = useState({ name: '', email: '', phone: '', department: '', location: '', latitude: null, longitude: null, password: '', confirmPassword: '', role: selectedRole });
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [success, setSuccess] = useState(false);
      const [pendingApproval, setPendingApproval] = useState(false);
      const [otpStep, setOtpStep] = useState(false);
      const [otp, setOtp] = useState('');
      const [otpLoading, setOtpLoading] = useState(false);
      const [otpSentMessage, setOtpSentMessage] = useState('');

      const handleSubmit = async (event) => {
        event.preventDefault();
        setError('');
        setOtpSentMessage('');
        if (form.password !== form.confirmPassword) {
          setError('Passwords do not match.');
          return;
        }
        if (!form.location.trim()) {
          setError('Please enter your location or choose your current location.');
          return;
        }
        if (selectedRole === 'official' && !form.department) {
          setError('Please select the department you work for.');
          return;
        }
        if (selectedRole === 'official' && (form.latitude === null || form.longitude === null)) {
          setError('Government officials must choose their current office GPS location.');
          return;
        }
        setLoading(true);
        try {
          const response = await apiRequest('/auth/signup/request-otp', {
            method: 'POST',
            body: JSON.stringify({
              name: form.name,
              email: form.email,
              phone: form.phone,
              department: selectedRole === 'official' ? form.department : '',
              location: form.location,
              coordinates: form.latitude !== null && form.longitude !== null ? { latitude: form.latitude, longitude: form.longitude } : null,
              password: form.password,
              role: form.role,
            }),
          });
          setOtpStep(true);
          setOtp('');
          setOtpSentMessage(response.message || `OTP sent successfully to ${form.email}.`);
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setLoading(false);
        }
      };

      const handleVerifyOtp = async (event) => {
        event.preventDefault();
        setError('');
        setOtpLoading(true);
        try {
          const response = await apiRequest('/auth/signup/verify-otp', {
            method: 'POST',
            body: JSON.stringify({ email: form.email, otp }),
          });
          setPendingApproval(Boolean(response.pendingApproval));
          setSuccess(true);
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setOtpLoading(false);
        }
      };

      return (
        <div className="auth-screen auth-signup-screen">
          <div className="auth-language"><LanguageSwitcher lang={lang} setLang={setLang} dark={true} /></div>
          <div className="auth-content auth-signup-content animate-slide-up">
            <div className="text-center mb-7">
              <div className="w-16 h-16 bg-white rounded-2xl flex items-center justify-center mx-auto shadow-xl mb-4">
                <span className="text-primary-700 font-extrabold text-3xl">C</span>
              </div>
              <h1 className="text-2xl font-bold text-white">Create your {selectedRole === 'official' ? 'Government Official' : 'Citizen'} account</h1>
              <p className="mt-2 text-primary-200">Join CivicResolve with the role selected in the Civic AI Agent.</p>
            </div>

            <div className="bg-white rounded-3xl shadow-2xl p-7 sm:p-8">
              {success ? (
                <div className="text-center py-5">
                  <div className="w-16 h-16 bg-emerald-50 rounded-full flex items-center justify-center mx-auto mb-5">
                    <Icon name="check-circle-2" size={34} className="text-emerald-500" />
                  </div>
                  <h2 className="text-xl font-bold text-slate-900">{pendingApproval ? 'Request sent for approval' : 'Account created'}</h2>
                  <p className="mt-2 text-sm text-slate-500">{pendingApproval ? 'Your email is verified. An admin must approve your government-official account before you can sign in.' : 'You can now continue from the login page.'}</p>
                  <button type="button" onClick={onBack} className="mt-6 w-full bg-primary-600 text-white font-semibold py-3.5 rounded-xl hover:bg-primary-700 transition-colors">
                    Back to login
                  </button>
                </div>
              ) : otpStep ? (
                <form onSubmit={handleVerifyOtp} className="space-y-5">
                  <div className="text-center">
                    <h2 className="text-xl font-bold text-slate-900">Verify your email</h2>
                    <div className="mt-4 rounded-xl border border-emerald-100 bg-emerald-50 px-4 py-3 text-left text-sm text-emerald-800">
                      <div className="flex items-start gap-2">
                        <Icon name="check-circle-2" size={18} className="mt-0.5 shrink-0 text-emerald-600" />
                        <div>
                          <strong>{otpSentMessage || 'OTP sent successfully.'}</strong>
                          <p className="mt-1 text-xs text-emerald-700">Please check {form.email}, including Spam or Promotions.</p>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-2">Email OTP</label>
                    <input required autoFocus inputMode="numeric" pattern="[0-9]{6}" maxLength="6" value={otp} onChange={e => setOtp(e.target.value.replace(/\D/g, '').slice(0, 6))}
                      placeholder="Enter 6-digit OTP" className="w-full text-center tracking-[0.4em] rounded-xl border border-slate-200 px-4 py-3.5 text-lg focus:ring-2 focus:ring-primary-500 outline-none bg-slate-50 focus:bg-white" />
                  </div>
                  {error && <p className="text-sm text-red-600 flex items-center gap-1.5"><Icon name="alert-circle" size={14} /> {error}</p>}
                  <button type="submit" disabled={otpLoading} className="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-primary-600 to-primary-700 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg disabled:opacity-70">
                    {otpLoading ? (<><Icon name="loader-2" size={20} className="animate-spin" /> Verifying...</>) : 'Verify OTP and create account'}
                  </button>
                  <button type="button" onClick={() => { setOtpStep(false); setOtp(''); setError(''); }} className="w-full text-sm font-semibold text-slate-500 hover:text-primary-700">
                    Edit signup details
                  </button>
                </form>
              ) : (
                <form onSubmit={handleSubmit} className="space-y-4">
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-2">Full name</label>
                    <input required type="text" value={form.name} onChange={e => setForm({ ...form, name: e.target.value })}
                      className="w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-primary-500 outline-none bg-slate-50 focus:bg-white" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-2">Email address</label>
                    <input required type="email" value={form.email} onChange={e => setForm({ ...form, email: e.target.value })}
                      className="w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-primary-500 outline-none bg-slate-50 focus:bg-white" />
                  </div>
                  <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-2">Phone number *</label>
                    <input required type="tel" value={form.phone} onChange={e => setForm({ ...form, phone: e.target.value })}
                      className="w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-primary-500 outline-none bg-slate-50 focus:bg-white" />
                  </div>
                  {selectedRole === 'official' && <div>
                    <label className="block text-sm font-semibold text-slate-700 mb-2">Responsible department *</label>
                    <select required value={form.department} onChange={e => setForm({ ...form, department: e.target.value })}
                      className="w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-primary-500 outline-none bg-slate-50 focus:bg-white">
                      <option value="">Select your department</option>
                      {officialDepartments.map(department => <option key={department.value} value={department.value}>{department.label}</option>)}
                    </select>
                    <p className="mt-1.5 text-xs text-slate-500">The agent will send only matching civic cases to your department.</p>
                  </div>}
                  <div>
                     <label className="block text-sm font-semibold text-slate-700 mb-2">{selectedRole === 'official' ? 'Government office location (GPS required)' : 'Location'}</label>
                    <div className="flex flex-col sm:flex-row gap-2">
                      <input required type="text" value={form.location} onChange={e => setForm({ ...form, location: e.target.value, latitude: null, longitude: null })}
                         placeholder={selectedRole === 'official' ? 'Office address, area or landmark' : 'Area, city or landmark'}
                        className="min-w-0 flex-1 rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-primary-500 outline-none bg-slate-50 focus:bg-white" />
                      <button type="button" onClick={() => {
                        if (!navigator.geolocation) { setError('Location is not supported by this browser.'); return; }
                        navigator.geolocation.getCurrentPosition(
                          position => setForm(prev => ({ ...prev, location: `Current location (${position.coords.latitude.toFixed(5)}, ${position.coords.longitude.toFixed(5)})`, latitude: position.coords.latitude, longitude: position.coords.longitude })),
                          () => setError('Unable to access your current location. Please enter it manually.'),
                        );
                      }} className="shrink-0 rounded-xl border border-primary-200 bg-primary-50 px-4 py-3 text-sm font-semibold text-primary-700 hover:bg-primary-100">
                          {selectedRole === 'official' ? 'Use my current office location' : 'Use my current location'}
                      </button>
                    </div>
                     {(form.latitude !== null && form.longitude !== null) && <p className="mt-1.5 text-xs text-emerald-600">Current location selected.</p>}
                     {selectedRole === 'official' && <p className="mt-1.5 text-xs text-slate-500">The agent uses this office GPS to automatically accept nearby complaints.</p>}
                  </div>
                  <div className="flex items-center gap-3 rounded-xl border border-primary-100 bg-primary-50 px-4 py-3 text-sm text-primary-800">
                    <Icon name={selectedRole === 'official' ? 'landmark' : 'user-round'} size={19} />
                    <span>Signing up as <strong>{selectedRole === 'official' ? 'Government Official' : 'Citizen'}</strong></span>
                  </div>
                  <div className="grid sm:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-semibold text-slate-700 mb-2">Password</label>
                      <input required minLength="8" type="password" value={form.password} onChange={e => setForm({ ...form, password: e.target.value })}
                        className="w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-primary-500 outline-none bg-slate-50 focus:bg-white" />
                    </div>
                    <div>
                      <label className="block text-sm font-semibold text-slate-700 mb-2">Confirm password</label>
                      <input required minLength="8" type="password" value={form.confirmPassword} onChange={e => setForm({ ...form, confirmPassword: e.target.value })}
                        className="w-full rounded-xl border border-slate-200 px-4 py-3 focus:ring-2 focus:ring-primary-500 outline-none bg-slate-50 focus:bg-white" />
                    </div>
                  </div>
                  {error && <p className="text-sm text-red-600 flex items-center gap-1.5"><Icon name="alert-circle" size={14} /> {error}</p>}
                  <button type="submit" disabled={loading} className="w-full flex items-center justify-center gap-2 bg-gradient-to-r from-primary-600 to-primary-700 text-white font-semibold py-3.5 rounded-xl transition-all shadow-lg disabled:opacity-70">
                    {loading ? (<><Icon name="loader-2" size={20} className="animate-spin" /> Creating account...</>) : 'Create account'}
                  </button>
                  <button type="button" onClick={onBack} className="w-full text-sm font-semibold text-slate-500 hover:text-primary-700">
                    Already have an account? Log in
                  </button>
                </form>
              )}
            </div>
          </div>
        </div>
      );
    }

    // ========== NAVBAR ==========
    function Navbar({ page, setPage, user, onLogout, lang, setLang }) {
      const t = translations[lang];
      const [open, setOpen] = useState(false);

      const getLinks = () => {
        if (user.role === 'citizen') return [
          { id: 'home', label: t.home }, { id: 'submit', label: t.fileComplaint }, { id: 'track', label: t.trackStatus }
        ];
        if (user.role === 'official') return [
          { id: 'home', label: t.home }, { id: 'dashboard', label: t.officerDashboard }, { id: 'track', label: t.trackCases }
        ];
        return [
          { id: 'home', label: t.home }, { id: 'dashboard', label: t.dashboard }, { id: 'analytics', label: t.cityAnalytics }, { id: 'track', label: t.trackCases }, { id: 'notifications', label: '🔔 Notifications' }
        ];
      };

      const links = getLinks();
      const roleLabel = { citizen: '👤 ' + t.citizen, official: '🏛️ ' + t.official, admin: '⚙️ ' + t.admin };

      return (
        <nav className="bg-white/90 backdrop-blur-md border-b border-slate-200/80 sticky top-0 z-50 shadow-sm">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex justify-between h-16 items-center">
              <button onClick={() => setPage('home')} className="flex items-center gap-2.5 group">
                <div className="w-9 h-9 bg-gradient-to-br from-primary-600 to-primary-700 rounded-xl flex items-center justify-center shadow-md group-hover:shadow-lg transition-shadow">
                  <span className="text-white font-bold text-lg">C</span>
                </div>
                <span className="font-bold text-lg text-slate-900 hidden sm:block">{t.appName}</span>
              </button>

              <div className="hidden md:flex items-center gap-1">
                {links.map(l => (
                  <button key={l.id} onClick={() => setPage(l.id)}
                    className={`px-4 py-2 rounded-xl text-sm font-medium transition-all duration-200 ${
                      page === l.id 
                        ? 'bg-primary-50 text-primary-700 shadow-sm' 
                        : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900'
                    }`}>
                    {l.label}
                  </button>
                ))}
              </div>

              <div className="flex items-center gap-3">
                <div className="hidden sm:block"><LanguageSwitcher lang={lang} setLang={setLang} /></div>
                <div className="hidden sm:flex flex-col items-end text-right">
                  <span className="text-xs font-medium text-slate-500">{roleLabel[user.role]}</span>
                  <span className="text-sm text-slate-700 max-w-[120px] truncate font-medium">{user.identifier}</span>
                </div>
                <button onClick={onLogout}
                  className="text-sm font-medium text-red-600 hover:text-red-700 px-3 py-1.5 rounded-lg hover:bg-red-50 transition-colors">
                  {t.logout}
                </button>
                <button className="md:hidden p-2 rounded-lg hover:bg-slate-100" onClick={() => setOpen(!open)}>
                  <Icon name={open ? "x" : "menu"} size={22} />
                </button>
              </div>
            </div>
          </div>

          {open && (
            <div className="md:hidden border-t border-slate-200 bg-white px-4 py-3 space-y-1 animate-fade-in">
              {links.map(l => (
                <button key={l.id} onClick={() => { setPage(l.id); setOpen(false); }}
                  className={`block w-full text-left px-4 py-2.5 rounded-xl text-sm font-medium ${page === l.id ? 'bg-primary-50 text-primary-700' : 'text-slate-600 hover:bg-slate-50'}`}>
                  {l.label}
                </button>
              ))}
              <div className="pt-3 border-t border-slate-100 mt-2 flex items-center justify-between px-2">
                <LanguageSwitcher lang={lang} setLang={setLang} />
                <button onClick={onLogout} className="text-sm font-medium text-red-600">{t.logout}</button>
              </div>
            </div>
          )}
        </nav>
      );
    }

    // ========== FOOTER ==========
    function Footer({ lang }) {

    function CitizenAssistanceChat({ displayName }) {
      const [messages, setMessages] = useState([
        { role: 'assistant', text: `Hi ${displayName}! I am your AI Assistance Agent. Ask me how your case is going, how much work is complete, which department has it, or what happens next.` },
      ]);
      const [input, setInput] = useState('');
      const [sending, setSending] = useState(false);

      const ask = async (question = input) => {
        const text = String(question || '').trim();
        if (!text || sending) return;
        setMessages(previous => [...previous, { role: 'user', text }]);
        setInput('');
        setSending(true);
        try {
          const response = await apiRequest('/citizen/assistant', {
            method: 'POST',
            body: JSON.stringify({ message: text }),
          });
          setMessages(previous => [...previous, { role: 'assistant', text: response.reply || 'I could not prepare an answer right now.' }]);
        } catch (error) {
          setMessages(previous => [...previous, { role: 'assistant', text: `I could not access your case information: ${error.message}` }]);
        } finally {
          setSending(false);
        }
      };

      return (
        <div className="mt-5 border-t border-slate-100 pt-5 text-left">
          <div className="flex items-start gap-3">
            <div className="flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-violet-50 text-violet-700"><Icon name="message-circle" size={20} /></div>
            <div>
              <h3 className="font-bold text-slate-900">AI Assistance</h3>
              <p className="mt-1 text-xs text-slate-500">Chat with the agent about your own complaint progress.</p>
            </div>
          </div>
          <div className="mt-4 max-h-64 space-y-3 overflow-y-auto rounded-2xl bg-slate-50 p-3">
            {messages.map((item, index) => <div key={`${item.role}-${index}`} className={`flex ${item.role === 'user' ? 'justify-end' : 'justify-start'}`}>
              <div className={`max-w-[90%] whitespace-pre-line rounded-2xl px-4 py-3 text-sm leading-relaxed ${item.role === 'user' ? 'bg-primary-700 text-white' : 'border border-slate-200 bg-white text-slate-700'}`}>{item.text}</div>
            </div>)}
            {sending && <div className="flex items-center gap-2 text-xs text-slate-500"><Icon name="loader-2" size={14} className="animate-spin" /> AI Assistance is checking your case records...</div>}
          </div>
          <div className="mt-3 flex flex-wrap gap-2">
            {['How is my latest case going?', 'How much is completed?', 'Which department has my case?'].map(question => <button key={question} type="button" onClick={() => ask(question)} disabled={sending} className="rounded-full border border-violet-200 bg-violet-50 px-3 py-1.5 text-xs font-semibold text-violet-700 hover:bg-violet-100 disabled:opacity-50">{question}</button>)}
          </div>
          <form onSubmit={event => { event.preventDefault(); ask(); }} className="mt-3 flex gap-2">
            <input value={input} onChange={event => setInput(event.target.value)} disabled={sending} placeholder="Ask about your case..." className="min-w-0 flex-1 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500" />
            <button type="submit" disabled={!input.trim() || sending} className="inline-flex items-center justify-center gap-2 rounded-xl bg-violet-700 px-4 py-3 text-sm font-semibold text-white hover:bg-violet-800 disabled:opacity-50"><Icon name="send" size={16} /> Ask</button>
          </form>
        </div>
      );
    }

      const categories = {

        hi: ['सड़क और गड्ढे', 'जल निकासी और बाढ़', 'कचरा प्रबंधन', 'जल आपूर्ति', 'स्ट्रीटलाइट', 'सार्वजनिक सुविधाएं', 'अन्य'],

      useEffect(() => {

          recognition.continuous = false;

          recognition.onerror = () => setIsListening(false);
          recognition.onend = () => setIsListening(false);

      }, [lang]);

      const toggleMic = () => {

      const handleImage = (e) => {

        if (!file.type.startsWith('image/')) {
          setSubmitError('Please upload an image file.');
          return;
        }
        if (file.size > 4_000_000) {
          setSubmitError('Please choose a photo smaller than 4 MB.');
          return;
        }
        const reader = new FileReader();
        reader.onload = () => {
          setImagePreview(reader.result);
          setSubmitError('');
            setLocationMessage('Photo ready. Enter the complaint location or choose your current location.');
        };
        reader.readAsDataURL(file);
      };

      const formatGpsLocation = (nextCoordinates) => `GPS location (${nextCoordinates.latitude.toFixed(5)}, ${nextCoordinates.longitude.toFixed(5)})`;

      const captureLocation = ({ silent = false } = {}) => {
        if (!navigator.geolocation) {
          if (!silent) setLocationMessage('GPS is not supported by this browser.');
          return Promise.resolve(null);
        }
        setLocationLoading(true);
        if (!silent) setLocationMessage('Requesting your current location...');
        return new Promise(resolve => navigator.geolocation.getCurrentPosition(
          position => {
            const nextCoordinates = { latitude: position.coords.latitude, longitude: position.coords.longitude, accuracy: position.coords.accuracy };
            setCoordinates(nextCoordinates);
            setForm(prev => ({ ...prev, location: prev.location.trim() || formatGpsLocation(nextCoordinates) }));
            setLocationMessage(`Agent GPS selected: accuracy approximately ${Math.round(position.coords.accuracy)} metres.`);
            setLocationLoading(false);
            resolve(nextCoordinates);
          },
          error => {
            setLocationMessage(error.code === 1 ? 'GPS permission was denied. You can enter the landmark manually.' : 'Unable to capture GPS. You can enter the landmark manually.');
            setLocationLoading(false);
            resolve(null);
          },
          { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 },

    function OfficialAssistanceChat({ onOpenCase }) {
      const [messages, setMessages] = useState([
        { role: 'assistant', text: 'Hello. I am your Government Operations AI Assistance Agent. Ask me about priority, SLA delays, recurring area problems, worker capacity, resources, or a complaint ID.' },
      ]);
      const [input, setInput] = useState('');
      const [sending, setSending] = useState(false);

      const ask = async (question = input) => {
        const text = String(question || '').trim();
        if (!text || sending) return;
        setMessages(previous => [...previous, { role: 'user', text }]);
        setInput('');
        setSending(true);
        try {
          const response = await apiRequest('/official/assistant', {
            method: 'POST',
            body: JSON.stringify({ message: text }),
          });
          const reply = response.reply || 'I could not prepare an answer right now.';
          const caseIds = [...new Set((reply.match(/CR-\d{6}/gi) || []).map(id => id.toUpperCase()))];
          setMessages(previous => [...previous, { role: 'assistant', text: reply, caseIds }]);
        } catch (error) {
          setMessages(previous => [...previous, { role: 'assistant', text: `I could not access the official queue: ${error.message}` }]);
        } finally {
          setSending(false);
        }
      };

      return (
        <section className="mb-8 rounded-3xl border border-primary-100 bg-primary-50/50 p-5 shadow-soft sm:p-6">
          <div className="flex items-start gap-3">

          </div>
          <div className="mt-3 flex flex-wrap gap-2">
            {['Show high-priority cases', 'Which complaints are overdue?', 'What problems repeat by area?', 'How many workers are available?'].map(question => <button key={question} type="button" onClick={() => ask(question)} disabled={sending} className="rounded-full border border-primary-200 bg-white px-3 py-1.5 text-xs font-semibold text-primary-700 hover:bg-primary-100 disabled:opacity-50">{question}</button>)}
          </div>
          <form onSubmit={event => { event.preventDefault(); ask(); }} className="mt-3 flex gap-2">
            <input value={input} onChange={event => setInput(event.target.value)} disabled={sending} placeholder="Ask about cases..." className="min-w-0 flex-1 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500" />
            <button type="submit" disabled={!input.trim() || sending} className="inline-flex items-center justify-center gap-2 rounded-xl bg-primary-700 px-4 py-3 text-sm font-semibold text-white hover:bg-primary-800 disabled:opacity-50"><Icon name="send" size={16} /> Ask</button>
          </form>
        </section>
      );
    }

    function AdminAssistanceChat() {
      const [messages, setMessages] = useState([
        { role: 'assistant', text: 'Hello. I am the Civic Administration AI Agent. Ask me about city-wide case counts, departments, recurring issues, similar cases or delays.' },
      ]);
      const [input, setInput] = useState('');
      const [sending, setSending] = useState(false);

      const ask = async (question = input) => {
        const text = String(question || '').trim();
        if (!text || sending) return;
        setMessages(previous => [...previous, { role: 'user', text }]);
        setInput('');
        setSending(true);
        try {
          const response = await apiRequest('/admin/assistant', { method: 'POST', body: JSON.stringify({ message: text }) });
          setMessages(previous => [...previous, { role: 'assistant', text: response.reply || 'I could not prepare an answer right now.' }]);
        } catch (error) {
          setMessages(previous => [...previous, { role: 'assistant', text: `I could not access city records: ${error.message}` }]);
        } finally {
          setSending(false);
        }
      };

      return (
        <section className="mb-8 rounded-3xl border border-violet-100 bg-violet-50/60 p-5 shadow-soft sm:p-6">
          <div className="flex items-start gap-3"><div className="flex h-11 w-11 shrink-0 items-center justify-center rounded-2xl bg-white text-violet-700"><Icon name="bot" size={22} /></div><div><h2 className="font-bold text-slate-900">Civic Administration AI Agent</h2><p className="mt-1 text-sm text-slate-600">Ask the agent to explain city-wide trends, department workloads and delayed cases.</p></div></div>
          <div className="mt-4 max-h-56 space-y-3 overflow-y-auto rounded-2xl bg-white p-3">{messages.map((item, index) => <div key={`${item.role}-${index}`} className={`flex ${item.role === 'user' ? 'justify-end' : 'justify-start'}`}><div className={`max-w-[90%] whitespace-pre-line rounded-2xl px-4 py-3 text-sm leading-relaxed ${item.role === 'user' ? 'bg-violet-700 text-white' : 'border border-slate-200 bg-slate-50 text-slate-700'}`}>{item.text}</div></div>)}{sending && <div className="flex items-center gap-2 text-xs text-slate-500"><Icon name="loader-2" size={14} className="animate-spin" /> Analyzing city records...</div>}</div>
          <div className="mt-3 flex flex-wrap gap-2">{['How many cases are filed?', 'Which departments have most cases?', 'Which cases are delayed?'].map(question => <button key={question} type="button" onClick={() => ask(question)} disabled={sending} className="rounded-full border border-violet-200 bg-white px-3 py-1.5 text-xs font-semibold text-violet-700 hover:bg-violet-100 disabled:opacity-50">{question}</button>)}</div>
          <form onSubmit={event => { event.preventDefault(); ask(); }} className="mt-3 flex gap-2"><input value={input} onChange={event => setInput(event.target.value)} disabled={sending} placeholder="Ask about city cases..." className="min-w-0 flex-1 rounded-xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none focus:border-violet-500 focus:ring-2 focus:ring-violet-500" /><button type="submit" disabled={!input.trim() || sending} className="inline-flex items-center justify-center gap-2 rounded-xl bg-violet-700 px-4 py-3 text-sm font-semibold text-white hover:bg-violet-800 disabled:opacity-50"><Icon name="send" size={16} /> Ask</button></form>
        </section>
      );
    }

    // ========== OFFICIAL CASE DASHBOARD ==========
    function OfficialDashboard({ lang, user }) {
      const [cases, setCases] = useState([]);
      const [intelligence, setIntelligence] = useState(null);
      const [officialProfile, setOfficialProfile] = useState({ availableWorkers: '', resources: '' });
      const [selectedId, setSelectedId] = useState('');
      const [statusValue, setStatusValue] = useState('Received');
      const [note, setNote] = useState('');
      const [photoDataUrl, setPhotoDataUrl] = useState('');
      const [loading, setLoading] = useState(true);
      const [actionLoading, setActionLoading] = useState('');
      const [resourceSaving, setResourceSaving] = useState(false);
      const [resourceMessage, setResourceMessage] = useState('');
      const [error, setError] = useState('');

      const selectedCase = cases.find(item => item.id === selectedId) || null;
      const assignedCases = cases.filter(item => item.assignedTo?.email === user.email);
      const availableCases = cases.filter(item => !item.assignedTo);
      const openCases = assignedCases.filter(item => item.status !== 'Resolved').length;
      const resolvedCases = assignedCases.filter(item => item.status === 'Resolved').length;
      const escalatedCases = assignedCases.filter(item => item.status === 'Escalated').length;
      const intelligenceCounts = intelligence?.counts || {};
      const intelligenceHighPriority = intelligence?.highPriorityCases || [];
      const intelligencePending = intelligence?.pendingCases || [];
      const intelligenceOverdue = intelligence?.overdueCases || [];
      const intelligenceDuplicates = intelligence?.duplicateCases || [];
      const intelligenceRecurring = intelligence?.recurringProblems || [];
      const intelligenceAssignments = intelligence?.assignmentRecommendations || [];

      const loadCases = async () => {
        setError('');
        try {
          const [recordsResponse, intelligenceResponse, profileResponse] = await Promise.all([
            apiRequest('/official/complaints'),
            apiRequest('/official/intelligence'),
            apiRequest('/official/profile'),
          ]);
          const records = recordsResponse || [];
          setCases(records);
          setIntelligence(intelligenceResponse || null);
          setOfficialProfile({
            ...(profileResponse || {}),
            availableWorkers: profileResponse?.availableWorkers ?? '',
            resources: profileResponse?.resources || '',
          });
          setSelectedId(current => current && records.some(item => item.id === current) ? current : (records[0]?.id || ''));
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => { loadCases(); }, []);

      useEffect(() => {
        if (selectedCase) {
          setStatusValue(selectedCase.status || 'Received');
          setNote('');
          setPhotoDataUrl('');
        }
      }, [selectedId]);

      const selectCase = (id) => {
        setSelectedId(id);
        setError('');
        window.setTimeout(() => document.getElementById('official-case-detail')?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 0);
      };

      const saveResources = async (event) => {
        event.preventDefault();
        setResourceSaving(true);
        setResourceMessage('');
        setError('');
        try {
          const updatedProfile = await apiRequest('/official/profile/resources', {
            method: 'PATCH',
            body: JSON.stringify({
              availableWorkers: officialProfile.availableWorkers === '' ? null : Number(officialProfile.availableWorkers),
              resources: officialProfile.resources,
            }),
          });
          setOfficialProfile({
            ...(updatedProfile || {}),
            availableWorkers: updatedProfile?.availableWorkers ?? '',
            resources: updatedProfile?.resources || '',
          });
          setResourceMessage('Workforce and resources updated for the Operations Agent.');
          setIntelligence(await apiRequest('/official/intelligence'));
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setResourceSaving(false);
        }
      };

      const handlePhoto = (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        if (file.size > 4 * 1024 * 1024) {
          setError('Please choose a resolution photo under 4 MB.');
          event.target.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onload = () => setPhotoDataUrl(String(reader.result || ''));
        reader.readAsDataURL(file);
      };

      const replaceCase = (updatedCase) => {
        setCases(current => current.map(item => item.id === updatedCase.id ? updatedCase : item));
        apiRequest('/official/intelligence').then(setIntelligence).catch(() => {});
      };

      const claimCase = async () => {
        if (!selectedCase) return;
        setActionLoading('claim');
        setError('');
        try {
          const updatedCase = await apiRequest(`/official/complaints/${selectedCase.id}/claim`, { method: 'POST' });
          replaceCase(updatedCase);
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setActionLoading('');
        }
      };

      const replanCase = async () => {
        if (!selectedCase) return;
        const reason = window.prompt('Why should the agent re-plan this case?', 'New information needs a fresh routing and priority review.');
        if (reason === null) return;
        setActionLoading('replan');
        setError('');
        try {
          const updatedCase = await apiRequest(`/official/complaints/${selectedCase.id}/replan`, {
            method: 'POST',
            body: JSON.stringify({ reason }),
          });
          replaceCase(updatedCase);
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setActionLoading('');
        }
      };

      const updateTask = async (taskId, taskStatus) => {
        if (!selectedCase) return;
        setActionLoading(`task-${taskId}`);
        setError('');
        try {
          const updatedCase = await apiRequest(`/official/complaints/${selectedCase.id}/tasks/${taskId}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: taskStatus }),
          });
          replaceCase(updatedCase);
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setActionLoading('');
        }
      };

      const saveCase = async (event) => {
        event.preventDefault();
        if (!selectedCase || selectedCase.assignedTo?.email !== user.email) return;
        setActionLoading('save');
        setError('');
        try {
          const updatedCase = await apiRequest(`/official/complaints/${selectedCase.id}`, {
            method: 'PATCH',
            body: JSON.stringify({ status: statusValue, note, resolutionPhotoDataUrl: photoDataUrl }),
          });
          replaceCase(updatedCase);
          setNote('');
          setPhotoDataUrl('');
        } catch (requestError) {
          setError(requestError.message);
        } finally {
          setActionLoading('');
        }
      };

      const formatDate = (value) => value ? new Date(value).toLocaleString() : '—';
      const priorityStyle = (item) => item.impactScore > 90
        ? 'bg-red-50 text-red-700'
        : item.impactScore > 70 ? 'bg-orange-50 text-orange-700' : 'bg-slate-100 text-slate-700';
      const isAssignedToMe = selectedCase?.assignedTo?.email === user.email;
      const timeline = selectedCase?.timeline || [];

      return (
        <div className="max-w-7xl mx-auto px-4 py-10 animate-fade-in">
          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8">
            <div>
              <h1 className="text-3xl font-bold text-slate-900">Official Case Dashboard</h1>
              <p className="text-slate-600 mt-1">Review assigned complaints, update progress, and document resolutions.</p>
              {user.department && <p className="mt-2 inline-flex items-center gap-2 rounded-full bg-primary-50 px-3 py-1.5 text-sm font-semibold text-primary-700"><Icon name="building-2" size={15} /> {user.department}</p>}
            </div>
            <button type="button" onClick={loadCases} className="inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-xl border border-slate-200 bg-white text-sm font-semibold text-slate-700 hover:bg-slate-50">
              <Icon name="refresh-cw" size={16} /> Refresh cases
            </button>
          </div>

          {error && <div className="mb-6 rounded-2xl bg-red-50 border border-red-100 px-5 py-4 text-sm text-red-700">{error}</div>}

          <div className="grid grid-cols-2 lg:grid-cols-4 gap-5 mb-8">
            {[
              { label: 'Assigned open', value: openCases, icon: 'clock-3', color: 'bg-blue-50 text-blue-600' },
              { label: 'Available to claim', value: availableCases.length, icon: 'inbox', color: 'bg-amber-50 text-amber-600' },
              { label: 'Escalated', value: escalatedCases, icon: 'alert-triangle', color: 'bg-red-50 text-red-600' },
              { label: 'Resolved', value: resolvedCases, icon: 'check-circle-2', color: 'bg-emerald-50 text-emerald-600' },
            ].map(item => (
              <div key={item.label} className="bg-white rounded-2xl border border-slate-100 p-5 shadow-soft">
                <div className={`w-11 h-11 rounded-xl flex items-center justify-center ${item.color}`}><Icon name={item.icon} size={22} /></div>
                <div className="mt-4 text-2xl font-bold text-slate-900">{item.value}</div>
                <div className="text-sm text-slate-500 font-medium mt-0.5">{item.label}</div>
              </div>
            ))}
          </div>

          <section className="mb-8 rounded-3xl border border-primary-100 bg-primary-50/40 p-5 shadow-soft sm:p-6">
            <div className="flex flex-col gap-2 sm:flex-row sm:items-start sm:justify-between">
              <div>
                <h2 className="flex items-center gap-2 font-bold text-slate-900"><Icon name="brain-circuit" size={20} className="text-primary-700" /> Official-side agent intelligence</h2>
                <p className="mt-1 text-sm text-slate-600">The Operations Agent continuously analyzes your department queue, SLA timing, duplicates, workload and location patterns.</p>
              </div>
              {intelligence?.generatedAt && <span className="text-xs text-slate-500">Updated {formatDate(intelligence.generatedAt)}</span>}
            </div>

            <div className="mt-5 grid grid-cols-2 gap-3 lg:grid-cols-5">
              {[
                { label: 'High priority', value: intelligenceCounts.highPriority ?? 0, icon: 'flame', color: 'bg-red-50 text-red-700' },
                { label: 'Pending / active', value: intelligenceCounts.pending ?? 0, icon: 'loader-circle', color: 'bg-blue-50 text-blue-700' },
                { label: 'Overdue / SLA', value: intelligenceCounts.overdue ?? 0, icon: 'alarm-clock', color: 'bg-orange-50 text-orange-700' },
                { label: 'Possible duplicates', value: intelligenceCounts.duplicates ?? 0, icon: 'copy', color: 'bg-violet-50 text-violet-700' },
                { label: 'Recurring areas', value: intelligenceCounts.recurringLocations ?? 0, icon: 'map-pinned', color: 'bg-emerald-50 text-emerald-700' },
              ].map(item => <div key={item.label} className="rounded-2xl border border-white bg-white p-4"><div className={`flex h-9 w-9 items-center justify-center rounded-xl ${item.color}`}><Icon name={item.icon} size={18} /></div><div className="mt-3 text-xl font-bold text-slate-900">{item.value}</div><div className="mt-0.5 text-xs font-medium text-slate-500">{item.label}</div></div>)}
            </div>

            <div className="mt-5 grid gap-4 lg:grid-cols-2">
              <div className="rounded-2xl border border-white bg-white p-5">
                <h3 className="flex items-center gap-2 font-semibold text-slate-900"><Icon name="list-checks" size={18} className="text-primary-600" /> Agent action queue</h3>
                <div className="mt-3 space-y-2">
                  {intelligenceHighPriority.slice(0, 4).map(item => <button type="button" key={`priority-${item.id}`} onClick={() => selectCase(item.id)} className="w-full rounded-xl border border-red-100 bg-red-50/60 px-3 py-2.5 text-left hover:bg-red-50"><div className="flex items-center justify-between gap-2"><span className="font-mono text-xs font-bold text-red-700">{item.id}</span><span className="text-[11px] font-semibold text-red-700">{item.priority} · {item.impactScore}/100</span></div><p className="mt-1 text-sm font-medium text-slate-800">{item.category} · {item.location}</p></button>)}
                  {intelligenceOverdue.slice(0, 4).map(item => <button type="button" key={`overdue-${item.id}`} onClick={() => selectCase(item.id)} className="w-full rounded-xl border border-orange-100 bg-orange-50/60 px-3 py-2.5 text-left hover:bg-orange-50"><div className="flex items-center justify-between gap-2"><span className="font-mono text-xs font-bold text-orange-700">{item.id}</span><span className="text-[11px] font-semibold text-orange-700">{item.overdueBy || 'SLA overdue'}</span></div><p className="mt-1 text-sm font-medium text-slate-800">{item.category} · {item.location}</p><p className="mt-1 text-xs text-orange-800">Escalation and supervisor review recommended.</p></button>)}
                  {!intelligenceHighPriority.length && !intelligenceOverdue.length && <p className="text-sm text-slate-500">No urgent or overdue action is currently detected.</p>}
                </div>
                <div className="mt-4 grid gap-3 sm:grid-cols-2">
                  <div className="rounded-xl bg-blue-50/70 p-3"><h4 className="text-xs font-bold uppercase tracking-wide text-blue-800">Pending review</h4><div className="mt-2 space-y-1.5">{intelligencePending.slice(0, 3).map(item => <button type="button" key={`pending-${item.id}`} onClick={() => selectCase(item.id)} className="block w-full truncate text-left font-mono text-xs font-semibold text-blue-700 hover:underline">{item.id} · {item.status}</button>)}{!intelligencePending.length && <p className="text-xs text-blue-700">No pending cases.</p>}</div></div>
                  <div className="rounded-xl bg-violet-50/70 p-3"><h4 className="text-xs font-bold uppercase tracking-wide text-violet-800">Duplicate review</h4><div className="mt-2 space-y-1.5">{intelligenceDuplicates.slice(0, 3).map(item => <button type="button" key={`duplicate-${item.id}`} onClick={() => selectCase(item.id)} className="block w-full truncate text-left font-mono text-xs font-semibold text-violet-700 hover:underline">{item.id} · {item.duplicates} similar</button>)}{!intelligenceDuplicates.length && <p className="text-xs text-violet-700">No duplicate candidates.</p>}</div></div>
                </div>
              </div>

              <div className="rounded-2xl border border-white bg-white p-5">
                <h3 className="flex items-center gap-2 font-semibold text-slate-900"><Icon name="route" size={18} className="text-primary-600" /> Assignment and recurring-problem recommendations</h3>
                <div className="mt-3 space-y-3">
                  {intelligenceAssignments.slice(0, 3).map(item => <button type="button" key={`assignment-${item.id}`} onClick={() => selectCase(item.id)} className="w-full rounded-xl border border-amber-100 bg-amber-50/60 px-3 py-2.5 text-left hover:bg-amber-50"><span className="font-mono text-xs font-bold text-amber-800">{item.id}</span><p className="mt-1 text-sm text-slate-700">{item.recommendation}</p></button>)}
                  {intelligenceRecurring.slice(0, 3).map(item => <div key={`recurring-${item.category}-${item.location}`} className="rounded-xl border border-emerald-100 bg-emerald-50/60 px-3 py-2.5"><p className="text-sm font-semibold text-emerald-900">{item.count} {item.category} reports · {item.location}</p><p className="mt-1 text-xs leading-relaxed text-emerald-800">{item.open} remain open. {item.recommendation}</p></div>)}
                  {!intelligenceAssignments.length && !intelligenceRecurring.length && <p className="text-sm text-slate-500">No unassigned cases or repeated location pattern detected.</p>}
                </div>
              </div>
            </div>

            <div className="mt-4 grid gap-4 lg:grid-cols-[1.2fr_0.8fr]">
              <div className="rounded-2xl border border-white bg-white p-5">
                <h3 className="flex items-center gap-2 font-semibold text-slate-900"><Icon name="map" size={18} className="text-primary-600" /> Area analysis · last 30 days</h3>
                <div className="mt-3 space-y-2">
                  {(intelligence?.areaAnalysis || []).slice(0, 5).map(item => <div key={`area-${item.category}-${item.location}`} className="flex flex-col gap-1 rounded-xl bg-slate-50 px-3 py-2.5 sm:flex-row sm:items-center sm:justify-between"><div><p className="text-sm font-semibold text-slate-800">{item.location}</p><p className="text-xs text-slate-500">{item.category} · {item.open} open</p></div><span className="text-xs font-semibold text-primary-700">{item.statement}</span></div>)}
                  {!intelligence?.areaAnalysis?.length && <p className="text-sm text-slate-500">The agent needs recent cases to identify area hotspots.</p>}
                </div>
              </div>

              <form onSubmit={saveResources} className="rounded-2xl border border-white bg-white p-5">
                <h3 className="flex items-center gap-2 font-semibold text-slate-900"><Icon name="users-round" size={18} className="text-primary-600" /> Team capacity for the agent</h3>
                <p className="mt-1 text-xs leading-relaxed text-slate-500">Give the Operations Agent your available workers and resources so it can recommend realistic assignments.</p>
                <label className="mt-4 block text-xs font-semibold text-slate-600">Available workers</label>
                <input type="number" min="0" max="100000" value={officialProfile.availableWorkers} onChange={event => setOfficialProfile(current => ({ ...current, availableWorkers: event.target.value }))} placeholder="e.g. 8" className="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500" />
                <label className="mt-3 block text-xs font-semibold text-slate-600">Resources / equipment</label>
                <input value={officialProfile.resources} onChange={event => setOfficialProfile(current => ({ ...current, resources: event.target.value }))} placeholder="e.g. 2 trucks, asphalt, pumps" maxLength={1000} className="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500" />
                <button type="submit" disabled={resourceSaving} className="mt-4 inline-flex w-full items-center justify-center gap-2 rounded-xl bg-primary-700 px-4 py-2.5 text-sm font-semibold text-white hover:bg-primary-800 disabled:opacity-60"><Icon name={resourceSaving ? 'loader-2' : 'save'} size={16} className={resourceSaving ? 'animate-spin' : ''} /> {resourceSaving ? 'Updating agent...' : 'Update agent context'}</button>
                {resourceMessage && <p className="mt-2 text-xs font-medium text-emerald-700">{resourceMessage}</p>}
                {intelligence?.capacity?.status && <p className="mt-2 text-xs leading-relaxed text-slate-500">Agent assessment: {intelligence.capacity.status}</p>}
              </form>
            </div>

            {!!intelligence?.departmentSummary?.length && <div className="mt-4 rounded-2xl border border-white bg-white p-5"><h3 className="flex items-center gap-2 font-semibold text-slate-900"><Icon name="building-2" size={18} className="text-primary-600" /> Department workload snapshot</h3><div className="mt-3 grid gap-2 sm:grid-cols-2 lg:grid-cols-3">{intelligence.departmentSummary.map(item => <div key={item.department} className="rounded-xl bg-slate-50 px-3 py-2.5"><p className="text-sm font-semibold text-slate-800">{item.department}</p><p className="mt-1 text-xs text-slate-500">{item.open} open · {item.highPriority} high priority · {item.overdue} overdue</p></div>)}</div></div>}
          </section>

          <OfficialAssistanceChat onOpenCase={selectCase} />

          <div className="grid lg:grid-cols-[minmax(0,0.85fr)_minmax(0,1.45fr)] gap-6">
            <section id="official-case-detail" className="bg-white rounded-3xl border border-slate-100 shadow-soft overflow-hidden">
              <div className="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                <div>
                  <h2 className="font-bold text-slate-900">Case queue</h2>
                  <p className="text-xs text-slate-500 mt-1">{cases.length} case{cases.length === 1 ? '' : 's'} visible to you</p>
                </div>
                <Icon name="clipboard-list" size={20} className="text-primary-600" />

                {cases.map(item => (
                  <button type="button" key={item.id} onClick={() => selectCase(item.id)} className={`w-full text-left px-5 py-4 hover:bg-slate-50 transition-colors ${selectedId === item.id ? 'bg-primary-50/70 border-l-4 border-primary-600' : 'border-l-4 border-transparent'}`}>

                      <p className="text-sm text-slate-700 mt-2">{selectedCase.agent.summary}</p>

                    {selectedCase.progressAnalysis && <div className="rounded-2xl border border-blue-100 bg-blue-50 p-5">
